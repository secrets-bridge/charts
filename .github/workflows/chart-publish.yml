name: chart-publish

# Publishes every Helm chart as an OCI artifact to GHCR.
#
# Resulting registry URLs:
#   oci://ghcr.io/secrets-bridge/charts/secrets-bridge
#   oci://ghcr.io/secrets-bridge/charts/secrets-bridge-agent
#   oci://ghcr.io/secrets-bridge/charts/secrets-bridge-gateway
#
# Versioning strategy (mirrors the image-publish convention from the
# app repos, adapted to Helm OCI's immutable-version semantics):
#
#   Push to `main`              → <Chart.yaml-version>-dev.<short-sha>
#                                 (e.g. 0.0.1-dev.54b682c). Each push
#                                 creates a unique, sortable
#                                 prerelease version. The plain
#                                 `Chart.yaml/version` itself is
#                                 NEVER pushed from main — operators
#                                 can't accidentally `helm install`
#                                 a chart called `0.0.1` from a
#                                 between-tags `main` commit.
#
#   Push tag `v0.1.0` (semver)  → 0.1.0 (literally — the tag minus
#                                 the leading `v`). The chart's
#                                 `Chart.yaml/version` MUST match
#                                 the tag, OR the workflow exits
#                                 with a clear error before pushing.
#
#   workflow_dispatch           → manual `dev.<sha>` rebuild
#
# Operators consume via:
#   helm registry login ghcr.io --username <user> \
#     --password <gh-token-with-read:packages>
#   helm pull oci://ghcr.io/secrets-bridge/charts/secrets-bridge \
#     --version 0.1.0
#   helm pull oci://ghcr.io/secrets-bridge/charts/secrets-bridge-agent \
#     --version '0.0.1-dev.*'  # wildcard picks latest dev
#
# Until v0.1.0 ships, the only stable channel is the `-dev.<sha>`
# series. After v0.1.0, the recommended pin is the semver tag.
#
# appVersion (the image tag every component defaults to):
#
#   Push to `main`              → Chart.yaml's appVersion (`dev`), left
#                                 as is. The chart version names a
#                                 commit in this repo, and no image is
#                                 tagged with it (charts#31).
#
#   Push tag `v0.1.0`           → 0.1.0, the tag each app repo's
#                                 docker-publish pushes for its own
#                                 `v0.1.0` tag.
#
# Before `helm push`, the job renders the packaged chart and checks that
# every image it references exists on GHCR, and fails if one doesn't.
#
# Every pushed chart is signed with cosign, keyless, by digest (the
# signing identity is this workflow). A version tag must be strict
# semver and point at a commit on main. After both charts of a tag are
# pushed, the release job creates the GitHub Release with their
# references and digests. All repos release under one shared version;
# see RELEASING.md in secrets-bridge/.github.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'secrets-bridge/**'
      - 'agent/**'
      - 'gateway/**'
      - '.github/workflows/chart-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v3.20.0
  REGISTRY: ghcr.io
  ORG: secrets-bridge

jobs:
  publish:
    name: package + push (${{ matrix.chart }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the OIDC token is the signing identity.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        chart: [secrets-bridge, agent, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A tag build needs main's history to check the tag is on it.
          fetch-depth: ${{ github.ref_type == 'tag' && 0 || 1 }}

      - name: Check the version tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semver tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-pre)"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG does not point at a commit on main"
            exit 1
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Resolve chart name + version
        id: chart
        env:
          CHART_DIR: ${{ matrix.chart }}
        run: |
          cd "$CHART_DIR"
          CHART_NAME=$(awk '/^name:/ {print $2; exit}' Chart.yaml)
          BASE_VERSION=$(awk '/^version:/ {print $2; exit}' Chart.yaml)
          echo "name=$CHART_NAME" >> "$GITHUB_OUTPUT"

          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/v*.*.* ]]; then
            TAG="${REF#refs/tags/v}"
            if [[ "$TAG" != "$BASE_VERSION" ]]; then
              echo "::error::Tag $REF (resolves to version $TAG) does not match Chart.yaml/version ($BASE_VERSION) in $CHART_DIR/. Bump Chart.yaml before tagging."
              exit 1
            fi
            VERSION="$TAG"
            CHANNEL="release"
            # The app repos push X.Y.Z (no `v`) for their vX.Y.Z tags.
            # The image check below fails the job if one hasn't yet.
            APP_VERSION="$TAG"
          else
            VERSION="${BASE_VERSION}-dev.${GITHUB_SHA:0:7}"
            CHANNEL="dev"
            # Keep Chart.yaml's appVersion (`dev`). VERSION names a
            # charts commit, which no image is tagged with (charts#31).
            APP_VERSION=""
          fi
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "app_version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved chart=$CHART_NAME  version=$VERSION  channel=$CHANNEL  app-version=${APP_VERSION:-<from Chart.yaml>}"

      - name: Package
        id: package
        env:
          CHART_DIR: ${{ matrix.chart }}
          CHART_NAME: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          APP_VERSION: ${{ steps.chart.outputs.app_version }}
          DEST: ${{ runner.temp }}/packaged
        run: |
          cd "$CHART_DIR"
          args=(--version "$VERSION" --destination "$DEST")
          if [ -n "$APP_VERSION" ]; then
            args+=(--app-version "$APP_VERSION")
          fi
          helm package . "${args[@]}"
          ls -l "$DEST"
          TGZ="$DEST/$CHART_NAME-$VERSION.tgz"
          echo "Packaged chart $(helm show chart "$TGZ" | grep -E '^(version|appVersion):' | tr '\n' ' ')"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Lint + render the packaged tarball
        env:
          TGZ: ${{ steps.package.outputs.tgz }}
          # A render that needs no image pins (env=dev for the control
          # plane, allowMutableTag for the agent and the gateway), so
          # every image keeps its default reference for the check below.
          # The gateway preset comes from the checkout (ci/ is not packaged).
          RENDER_FLAGS: ${{ matrix.chart == 'agent' && '--set clusterName=ci --set cp.endpoint=https://x.example.com --set identity.existingSecret=ci --set image.allowMutableTag=true' || matrix.chart == 'gateway' && '-f gateway/ci/r1-values.yaml --set image.digest= --set image.allowMutableTag=true' || '--set env=dev --set kms.backend=local --set ingress.host=x.example.com' }}
          RENDERED: ${{ runner.temp }}/rendered.yaml
        run: |
          # Belt-and-braces: verify the tarball helm just produced
          # actually lints clean (catches packaging-time regressions
          # the file-tree lint doesn't see).
          helm lint "$TGZ"
          # shellcheck disable=SC2086 # RENDER_FLAGS is a list of flags
          helm template ci-smoke "$TGZ" $RENDER_FLAGS > "$RENDERED"

      - name: Check the default images exist on GHCR
        # A chart must not default to an image that was never pushed
        # (charts#31). Every image the render above references has to
        # resolve on GHCR, or the job stops here, before `helm push`.
        env:
          RENDERED: ${{ runner.temp }}/rendered.yaml
        run: .github/scripts/check-image-refs.sh "$RENDERED"

      - name: Helm registry login (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username ${{ github.actor }} --password-stdin

      - name: Push to GHCR (oci://${{ env.REGISTRY }}/${{ env.ORG }}/charts)
        id: push
        env:
          TGZ: ${{ steps.package.outputs.tgz }}
          DEST: oci://${{ env.REGISTRY }}/${{ env.ORG }}/charts
        run: |
          out=$(helm push "$TGZ" "$DEST" 2>&1)
          echo "$out"
          digest=$(awk '/^Digest:/ {print $2}' <<<"$out")
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the chart
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          CHART: ${{ env.REGISTRY }}/${{ env.ORG }}/charts/${{ steps.chart.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # helm's registry login doesn't reach cosign's credential store.
          echo "$GH_TOKEN" | cosign login "${CHART%%/*}" --username "$ACTOR" --password-stdin
          cosign sign --yes "${CHART}@${DIGEST}"

      - name: Output published version
        run: |
          echo "Published:"
          echo "  oci://${{ env.REGISTRY }}/${{ env.ORG }}/charts/${{ steps.chart.outputs.name }}:${{ steps.chart.outputs.version }}"
          echo
          echo "Consume:"
          echo "  helm pull oci://${{ env.REGISTRY }}/${{ env.ORG }}/charts/${{ steps.chart.outputs.name }} \\"
          echo "    --version ${{ steps.chart.outputs.version }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          CHARTS: ${{ env.REGISTRY }}/${{ env.ORG }}/charts
          WORKFLOW: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/chart-publish.yml@${{ github.ref }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "### Charts"
            echo
            for name in secrets-bridge secrets-bridge-agent secrets-bridge-gateway; do
              # The digest of the pushed chart, read back from GHCR (the
              # charts are public, so an anonymous pull token is enough).
              token=$(curl -fsS "https://ghcr.io/token?scope=repository:${CHARTS#ghcr.io/}/${name}:pull" | jq -r .token)
              digest=$(curl -fsSI -H "Authorization: Bearer ${token}" \
                -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                "https://ghcr.io/v2/${CHARTS#ghcr.io/}/${name}/manifests/${version}" \
                | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2}')
              [[ "$digest" == sha256:* ]] || { echo "::error::no digest for ${name}:${version}"; exit 1; }
              echo "- \`helm pull oci://${CHARTS}/${name} --version ${version}\` (\`${digest}\`)"
              echo
              echo '```'
              echo "cosign verify ${CHARTS}/${name}@${digest} \\"
              echo "  --certificate-identity ${WORKFLOW} \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo '```'
              echo
            done
          } > "$notes"
          args=(--title "$TAG" --verify-tag --generate-notes --notes-file "$notes" --repo "$REPO")
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}"
