name: ci

# Gates every chart change with these jobs:
#
#   1. lint          — `helm lint` for each chart
#   2. template      — `helm template` under realistic presets and
#                      `kubeconform` against the rendered manifests
#                      to catch any K8s-API-shape regression before
#                      it reaches a cluster
#   3. safety-rails  — verifies the documented render-time `fail`
#                      guards actually trip (otherwise the safety
#                      story is theatre, not code)
#   4. agent-file-mode-overrides — explicit strategy / fsGroupChangePolicy
#                      values win over the agent's file-mode defaults
#   5. agent-ssa-upgrade — on a kind cluster, the file-mode strategy applies
#                      with server-side apply over a Deployment that carries
#                      the defaulted rollingUpdate block (#37)
#   6. release-name  — sanity check that the chart names + per-component
#                      fullnames truncate cleanly to ≤63 chars under a
#                      long release name (K8s label length limit)
#
# CI does NOT publish. OCI publish to GHCR lands in a follow-up
# workflow gated on git tags `v*.*.*`.

on:
  push:
    branches: [main]
    paths:
      - 'secrets-bridge/**'
      - 'agent/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'secrets-bridge/**'
      - 'agent/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'

permissions:
  contents: read

env:
  HELM_VERSION: v3.20.0
  KUBECONFORM_VERSION: v0.7.0

jobs:
  lint:
    name: helm lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [secrets-bridge, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint ${{ matrix.chart }}
        run: helm lint ${{ matrix.chart }}/

  template:
    name: helm template + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render + validate secrets-bridge (dev preset)
        run: |
          mkdir -p out
          helm template ci-dev secrets-bridge/ \
            --namespace secrets-bridge \
            --set env=dev \
            --set kms.backend=local \
            --set ingress.host=sb.example.com \
            > out/secrets-bridge-dev.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/secrets-bridge-dev.yaml

      - name: Render + validate secrets-bridge (production aws-kms preset)
        # env=production requires every enabled component to resolve to a
        # pinned image (CHT-03 / M11; see secrets-bridge.validateImageTags).
        # api exercises the digest path, the rest exercise a pinned tag, so
        # both mechanisms get covered by this one preset.
        run: |
          helm template ci-prod secrets-bridge/ \
            --namespace secrets-bridge \
            --set env=production \
            --set kms.backend=aws-kms \
            --set kms.awsKms.region=us-east-1 \
            --set kms.awsKms.keyId=alias/sb-wrap \
            --set 'api.serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::123456789012:role/sb-api' \
            --set ingress.host=sb.example.com \
            --set ingress.tls.clusterIssuer=letsencrypt-prod \
            --set controller.config.leaderElect=true \
            --set controller.metricsService.enabled=true \
            --set controller.config.metricsAddr=":8080" \
            --set api.image.digest=sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 \
            --set ui.image.tag=0.1.0 \
            --set worker.image.tag=0.1.0 \
            --set controller.image.tag=0.1.0 \
            > out/secrets-bridge-prod.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/secrets-bridge-prod.yaml

      - name: Render + validate secrets-bridge (production vault-transit preset)
        run: |
          helm template ci-vault secrets-bridge/ \
            --namespace secrets-bridge \
            --set env=production \
            --set kms.backend=vault-transit \
            --set kms.vaultTransit.addr=https://vault.example.com \
            --set kms.vaultTransit.key=sb-wrap \
            --set ingress.host=sb.example.com \
            --set api.image.tag=0.1.0 \
            --set ui.image.tag=0.1.0 \
            --set worker.image.tag=0.1.0 \
            --set controller.image.tag=0.1.0 \
            > out/secrets-bridge-vault.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/secrets-bridge-vault.yaml

      - name: Render + validate secrets-bridge (object store, AWS S3 with IRSA preset)
        # charts#39: AWS S3 with SSE-KMS, credentials from the api's IRSA
        # role. No endpoint, so the egress rule is 443 to any destination.
        run: |
          helm template ci-s3 secrets-bridge/ \
            --namespace secrets-bridge \
            --set env=production \
            --set kms.backend=aws-kms \
            --set kms.awsKms.region=us-east-1 \
            --set kms.awsKms.keyId=alias/sb-wrap \
            --set 'api.serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::123456789012:role/sb-api' \
            --set ingress.host=sb.example.com \
            --set objectStore.enabled=true \
            --set objectStore.bucket=example-bucket \
            --set objectStore.region=us-east-1 \
            --set objectStore.prefix=secrets-bridge \
            --set objectStore.sse=aws:kms \
            --set objectStore.kmsKeyId=alias/sb-media \
            --set api.image.tag=0.1.0 \
            --set ui.image.tag=0.1.0 \
            --set worker.image.tag=0.1.0 \
            --set controller.image.tag=0.1.0 \
            > out/secrets-bridge-s3.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/secrets-bridge-s3.yaml
          f=out/secrets-bridge-s3.yaml
          grep -A1 'name: SB_OBJECTSTORE_BUCKET' $f | grep -q '"example-bucket"'
          grep -A1 'name: SB_OBJECTSTORE_SSE' $f | grep -q '"aws:kms"'
          grep -A1 'name: SB_OBJECTSTORE_KMS_KEY_ID' $f | grep -q '"alias/sb-media"'
          grep -A1 'name: SB_OBJECTSTORE_FORCE_PATH_STYLE' $f | grep -q '"false"'
          # api#255: the logo backfill is on by default.
          grep -A1 'name: SB_OBJECTSTORE_LOGO_BACKFILL' $f | grep -q '"true"'
          # IRSA only: no endpoint, no static keys.
          if grep -q 'SB_OBJECTSTORE_ENDPOINT' $f; then exit 1; fi
          if grep -q 'name: AWS_ACCESS_KEY_ID' $f; then exit 1; fi
          helm template ci-s3 secrets-bridge/ --namespace secrets-bridge \
            --set env=production --set kms.backend=aws-kms \
            --set kms.awsKms.region=us-east-1 --set kms.awsKms.keyId=alias/sb-wrap \
            --set ingress.host=sb.example.com --set api.image.tag=0.1.0 \
            --set ui.image.tag=0.1.0 --set worker.image.tag=0.1.0 \
            --set controller.image.tag=0.1.0 \
            --set objectStore.enabled=true --set objectStore.bucket=example-bucket \
            --set objectStore.region=us-east-1 \
            --show-only templates/api/networkpolicy.yaml \
            | grep -B1 -A1 'port: 443' | grep -q 'protocol: TCP'
          # The worker doesn't read media, so it gets no object store env.
          helm template ci-s3 secrets-bridge/ --namespace secrets-bridge \
            --set env=dev --set kms.backend=local --set ingress.host=sb.example.com \
            --set objectStore.enabled=true --set objectStore.bucket=example-bucket \
            --set objectStore.region=us-east-1 \
            --show-only templates/worker/deployment.yaml > out/s3-worker.yaml
          if grep -q 'SB_OBJECTSTORE' out/s3-worker.yaml; then exit 1; fi
          # With the store off (the default) the api gets no object store
          # env at all, the backfill flag included.
          helm template ci-s3 secrets-bridge/ --namespace secrets-bridge \
            --set env=dev --set kms.backend=local --set ingress.host=sb.example.com \
            --show-only templates/api/deployment.yaml > out/s3-off-api.yaml
          if grep -q 'SB_OBJECTSTORE' out/s3-off-api.yaml; then exit 1; fi

      - name: Render + validate secrets-bridge (object store, MinIO preset)
        # charts#39: an S3-compatible server with path-style addressing,
        # static keys from an existing Secret and no SSE header. Plain
        # HTTP is only allowed under env=dev. The egress rule takes the
        # endpoint's port and the in-cluster MinIO namespace.
        run: |
          helm template ci-minio secrets-bridge/ \
            --namespace secrets-bridge \
            --set env=dev \
            --set kms.backend=local \
            --set ingress.host=sb.example.com \
            --set objectStore.enabled=true \
            --set objectStore.bucket=example-bucket \
            --set objectStore.region=us-east-1 \
            --set objectStore.endpoint=http://s3.example.com:9000 \
            --set objectStore.forcePathStyle=true \
            --set objectStore.sse= \
            --set objectStore.credentials.existingSecret=sb-objectstore-creds \
            --set objectStore.logoBackfill=false \
            --set 'api.networkPolicy.egress.objectStore.to[0].namespaceSelector.matchLabels.kubernetes\.io/metadata\.name=minio' \
            > out/secrets-bridge-minio.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/secrets-bridge-minio.yaml
          f=out/secrets-bridge-minio.yaml
          grep -A1 'name: SB_OBJECTSTORE_ENDPOINT' $f | grep -q '"http://s3.example.com:9000"'
          grep -A1 'name: SB_OBJECTSTORE_FORCE_PATH_STYLE' $f | grep -q '"true"'
          grep -A4 'name: AWS_ACCESS_KEY_ID' $f | grep -q 'name: "sb-objectstore-creds"'
          grep -A4 'name: AWS_SECRET_ACCESS_KEY' $f | grep -q 'key: "AWS_SECRET_ACCESS_KEY"'
          if grep -q 'SB_OBJECTSTORE_SSE' $f; then exit 1; fi
          # Step 1 of the two-step upgrade (api#255): backfill switched off.
          grep -A1 'name: SB_OBJECTSTORE_LOGO_BACKFILL' $f | grep -q '"false"'
          grep -A6 'port: 9000' $f | grep -q 'kubernetes.io/metadata.name: minio'

      - name: Render + validate agent (full preset with NetworkPolicy)
        # The agent only renders a pinned image (CHT-N-01). This preset
        # exercises the digest path, the private-CA one a release tag.
        run: |
          helm template ci-agent agent/ \
            --namespace secrets-bridge \
            --set clusterName=ci-cluster \
            --set cp.endpoint=https://sb.example.com \
            --set image.digest=sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 \
            --set providers.vault.enabled=true \
            --set providers.vault.addr=http://vault.svc:8200 \
            --set providers.vault.kubernetesRole=ci-agent \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.allowCIDRs={10.0.0.10/32,10.0.0.20/32}' \
            --set podDisruptionBudget.enabled=true \
            > out/agent.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/agent.yaml
          # Static mode keeps the Kubernetes defaults.
          if grep -q 'strategy:' out/agent.yaml; then exit 1; fi
          if grep -q 'fsGroupChangePolicy' out/agent.yaml; then exit 1; fi

      - name: Render + validate agent (enrollment / file-mode preset)
        run: |
          helm template ci-agent-enroll agent/ \
            --namespace secrets-bridge \
            --set clusterName=ci-cluster \
            --set cp.endpoint=https://sb.example.com \
            --set image.tag=0.1.0 \
            --set identity.mode=file \
            --set identity.persistence.enabled=true \
            --set enrollment.enabled=true \
            --set enrollment.tokenSecretName=sb-agent-enroll \
            --set providers.awsSecretsManager.enabled=true \
            --set providers.awsSecretsManager.region=us-east-1 \
            > out/agent-enroll.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/agent-enroll.yaml
          # File mode: no surge pod (RWO identity PVC), and not type Recreate,
          # which server-side apply can't switch an existing Deployment to (#37).
          grep -A3 'type: RollingUpdate' out/agent-enroll.yaml | grep -q 'maxSurge: 0'
          grep -A3 'type: RollingUpdate' out/agent-enroll.yaml | grep -q 'maxUnavailable: 100%'
          if grep -q 'type: Recreate' out/agent-enroll.yaml; then exit 1; fi
          # File mode: kubelet must not re-add group bits to the identity files.
          grep -q 'fsGroupChangePolicy: OnRootMismatch' out/agent-enroll.yaml
          grep -A1 'name: SB_AGENT_PRIVATE_KEY_FILE' out/agent-enroll.yaml | grep -q '/var/lib/secrets-bridge-agent/agent.key'

      - name: Render + validate agent (private-CA TLS preset)
        run: |
          helm template ci-agent-ca agent/ \
            --namespace secrets-bridge \
            --set clusterName=ci-cluster \
            --set cp.endpoint=https://sb.internal \
            --set cp.caExistingSecret=cp-ca \
            --set cp.tlsServerName=sb.internal \
            --set image.tag=0.1.0 \
            > out/agent-ca.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/agent-ca.yaml

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-manifests
          path: out/
          retention-days: 7

  safety-rails:
    name: safety rails trip
    runs-on: ubuntu-latest
    env:
      # Shared flags so each case differs from a valid render by exactly
      # the input under test. PROD is a valid production KMS config;
      # PINNED pins every control-plane image; AGENT is a valid agent.
      PROD: >-
        --set env=production --set kms.backend=aws-kms
        --set kms.awsKms.region=us-east-1 --set kms.awsKms.keyId=alias/sb-wrap
        --set ingress.host=x.example.com
      PINNED: >-
        --set api.image.tag=0.1.0 --set ui.image.tag=0.1.0
        --set worker.image.tag=0.1.0 --set controller.image.tag=0.1.0
      AGENT: --set clusterName=ci --set cp.endpoint=https://x.example.com
      # A valid object store config (AWS S3, SSE-S3 by default).
      OBJSTORE: >-
        --set objectStore.enabled=true --set objectStore.bucket=example-bucket
        --set objectStore.region=us-east-1
      DIGEST: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      # A valid enrollment (file-mode) agent, pinned.
      ENROLL: >-
        --set image.tag=0.1.0 --set identity.mode=file
        --set identity.persistence.enabled=true --set enrollment.enabled=true
        --set enrollment.tokenSecretName=sb-agent-enroll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # `reject` cases must fail to render AND fail with the named error,
      # so a case can't pass because a different guard tripped first.
      # `accept` cases must render.
      - name: production + LocalKMS must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'kms.backend="local" is not permitted' secrets-bridge/ \
            --set env=production --set kms.backend=local --set ingress.host=x.example.com $PINNED

      - name: unknown env value must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'env="staging" is not recognised' secrets-bridge/ \
            --set env=staging --set kms.backend=aws-kms --set ingress.host=x.example.com

      - name: unknown kms.backend must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'kms.backend="azure-key-vault" is not recognised' secrets-bridge/ \
            --set env=production --set kms.backend=azure-key-vault --set ingress.host=x.example.com $PINNED

      # CHT-N-05: the binaries compare SB_ENV / SB_KMS_BACKEND exactly.
      - name: env with the wrong case (Production) must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'env="Production" is not recognised' secrets-bridge/ \
            $PROD $PINNED --set env=Production

      - name: kms.backend with the wrong case (AWS-KMS) must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'kms.backend="AWS-KMS" is not recognised' secrets-bridge/ \
            $PROD $PINNED --set kms.backend=AWS-KMS

      - name: dev + kms.backend with the wrong case (Local) must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'kms.backend="Local" is not recognised' secrets-bridge/ \
            --set env=dev --set kms.backend=Local --set ingress.host=x.example.com

      # CHT-03 / CHT-N-02: production renders pinned images only.
      - name: production + unpinned default (:dev) image must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'api.image resolves to tag "dev", which is not a pinned image' secrets-bridge/ \
            $PROD

      - name: production + floating tag main must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'api.image resolves to tag "main", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set api.image.tag=main

      - name: production + floating tag latest must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'worker.image resolves to tag "latest", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set worker.image.tag=latest

      - name: production + floating X.Y tag must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'ui.image resolves to tag "1.2", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set-string ui.image.tag=1.2

      - name: production + floating X tag must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'controller.image resolves to tag "1", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set controller.image.tag=1

      # charts#31: a chart dev version looks like a semver prerelease,
      # but no image is tagged with it.
      - name: production + chart dev version (X.Y.Z-dev.<sha>) as tag must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'api.image resolves to tag "0.0.1-dev.0123abc", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set api.image.tag=0.0.1-dev.0123abc

      - name: repo@sha256 digest must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'api.image.digest="ghcr.io/secrets-bridge/api@sha256:' secrets-bridge/ \
            $PROD $PINNED --set api.image.digest=ghcr.io/secrets-bridge/api@$DIGEST

      - name: production + pinned images (digest, X.Y.Z, vX.Y.Z-rc, sha-<hex>) must be accepted
        run: |
          .github/scripts/expect-render.sh accept secrets-bridge/ $PROD \
            --set api.image.digest=$DIGEST --set ui.image.tag=0.1.0 \
            --set worker.image.tag=v1.2.3-rc.1 --set controller.image.tag=sha-0123abc

      - name: dev + default (:dev) image must still be accepted
        run: |
          .github/scripts/expect-render.sh accept secrets-bridge/ \
            --set env=dev --set kms.backend=local --set ingress.host=x.example.com

      # charts#39: object storage for media.
      - name: objectStore enabled without a bucket must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.enabled=true requires objectStore.bucket' secrets-bridge/ \
            $PROD $PINNED --set objectStore.enabled=true

      - name: objectStore enabled without a region must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.enabled=true requires objectStore.region' secrets-bridge/ \
            $PROD $PINNED --set objectStore.enabled=true --set objectStore.bucket=example-bucket

      - name: objectStore kmsKeyId without sse=aws:kms must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.kmsKeyId is set but objectStore.sse="AES256"' secrets-bridge/ \
            $PROD $PINNED $OBJSTORE --set objectStore.kmsKeyId=alias/sb-media

      - name: objectStore prefix with a .. segment must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.prefix="a/../b" has an empty, . or .. segment' secrets-bridge/ \
            $PROD $PINNED $OBJSTORE --set objectStore.prefix=a/../b

      - name: objectStore logoBackfill that isn't true or false must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.logoBackfill="maybe" must be true or false' secrets-bridge/ \
            $PROD $PINNED $OBJSTORE --set objectStore.logoBackfill=maybe

      - name: objectStore sse=aws:kms without kmsKeyId must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.sse="aws:kms" requires objectStore.kmsKeyId' secrets-bridge/ \
            $PROD $PINNED $OBJSTORE --set objectStore.sse=aws:kms

      - name: objectStore sse with the wrong case (aes256) must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.sse="aes256" is not recognised' secrets-bridge/ \
            $PROD $PINNED $OBJSTORE --set objectStore.sse=aes256

      - name: production + plain HTTP objectStore endpoint must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.endpoint="http://s3.example.com:9000" is plain HTTP' secrets-bridge/ \
            $PROD $PINNED $OBJSTORE --set objectStore.endpoint=http://s3.example.com:9000

      - name: objectStore endpoint without a scheme must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.endpoint="s3.example.com" is not a URL' secrets-bridge/ \
            $PROD $PINNED $OBJSTORE --set objectStore.endpoint=s3.example.com

      - name: objectStore static credentials with kms.backend=aws-kms must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'objectStore.credentials.existingSecret cannot be combined with kms.backend=aws-kms' secrets-bridge/ \
            $PROD $PINNED $OBJSTORE --set objectStore.credentials.existingSecret=sb-objectstore-creds

      - name: objectStore valid configs must be accepted
        run: |
          # AWS S3 with SSE-KMS, production.
          .github/scripts/expect-render.sh accept secrets-bridge/ $PROD $PINNED $OBJSTORE \
            --set objectStore.sse=aws:kms --set objectStore.kmsKeyId=alias/sb-media
          # HTTPS S3-compatible endpoint with static keys, production + vault-transit.
          .github/scripts/expect-render.sh accept secrets-bridge/ $PINNED $OBJSTORE \
            --set env=production --set kms.backend=vault-transit --set kms.vaultTransit.key=sb-wrap \
            --set ingress.host=x.example.com \
            --set objectStore.endpoint=https://s3.example.com:9000 --set objectStore.forcePathStyle=true \
            --set objectStore.sse= --set objectStore.credentials.existingSecret=sb-objectstore-creds
          # Plain HTTP endpoint under env=dev.
          .github/scripts/expect-render.sh accept secrets-bridge/ $OBJSTORE \
            --set env=dev --set kms.backend=local --set ingress.host=x.example.com \
            --set objectStore.endpoint=http://s3.example.com:9000
          # Backfill off as a string (step 1 of the upgrade), slashes
          # around the prefix trimmed by the api.
          .github/scripts/expect-render.sh accept secrets-bridge/ $PROD $PINNED $OBJSTORE \
            --set-string objectStore.logoBackfill=false --set objectStore.prefix=/secrets-bridge/
          # Disabled (the default) ignores every other objectStore value.
          .github/scripts/expect-render.sh accept secrets-bridge/ $PROD $PINNED \
            --set objectStore.sse=aes256 --set objectStore.endpoint=http://s3.example.com

      - name: agent missing clusterName must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'clusterName is required' agent/ \
            --set cp.endpoint=https://x.example.com --set image.tag=0.1.0

      - name: agent plain HTTP without insecureTransport must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'is plain HTTP' agent/ \
            --set clusterName=ci --set cp.endpoint=http://insecure.example.com --set image.tag=0.1.0

      # CHT-N-01: the agent has no env value, so pinning always applies
      # unless the dev-only image.allowMutableTag escape hatch is set.
      - name: agent default (:dev) image must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'image resolves to tag "dev", which is not a pinned image' agent/ \
            $AGENT

      - name: agent floating tag main must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'image resolves to tag "main", which is not a pinned image' agent/ \
            $AGENT --set image.tag=main

      - name: agent chart dev version (X.Y.Z-dev.<sha>) as tag must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'image resolves to tag "0.0.2-dev.0123abc", which is not a pinned image' agent/ \
            $AGENT --set image.tag=0.0.2-dev.0123abc

      - name: agent repo@sha256 digest must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'image.digest="ghcr.io/secrets-bridge/agent@sha256:' agent/ \
            $AGENT --set image.digest=ghcr.io/secrets-bridge/agent@$DIGEST

      - name: agent pinned images (digest, X.Y.Z, sha-<hex>) must be accepted
        run: |
          .github/scripts/expect-render.sh accept agent/ $AGENT --set image.digest=$DIGEST
          .github/scripts/expect-render.sh accept agent/ $AGENT --set image.tag=0.1.0
          .github/scripts/expect-render.sh accept agent/ $AGENT --set image.tag=sha-0123abc

      - name: agent :dev with image.allowMutableTag=true must be accepted
        run: |
          .github/scripts/expect-render.sh accept agent/ $AGENT --set image.allowMutableTag=true

      # CHT-N-06: Vault Kubernetes auth reads the projected SA token.
      - name: agent Vault Kubernetes auth with the SA token off must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'serviceAccount.automountServiceAccountToken=false' agent/ \
            $AGENT --set image.tag=0.1.0 \
            --set providers.vault.enabled=true --set providers.vault.addr=https://vault.example.com \
            --set providers.vault.kubernetesRole=sb-agent \
            --set serviceAccount.automountServiceAccountToken=false

      # File mode keeps the wire-envelope key next to the credential.
      - name: agent privateKeyFileName equal to identity.fileName must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'must differ from identity.fileName' agent/ \
            $AGENT $ENROLL --set identity.privateKeyFileName=identity.json

      - name: agent privateKeyFileName with a path must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'must be a bare file name' agent/ \
            $AGENT $ENROLL --set identity.privateKeyFileName=keys/agent.key

      - name: agent privateKeyFileName "." or ".." must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'must be a bare file name' agent/ \
            $AGENT $ENROLL --set identity.privateKeyFileName=.
          .github/scripts/expect-render.sh reject 'must be a bare file name' agent/ \
            $AGENT $ENROLL --set identity.privateKeyFileName=..

      - name: agent file mode with privateKeyFileName empty (ephemeral key) must be accepted
        run: |
          .github/scripts/expect-render.sh accept agent/ $AGENT $ENROLL --set identity.privateKeyFileName=

  agent-file-mode-overrides:
    name: agent file-mode overrides
    runs-on: ubuntu-latest
    env:
      ARGS: >-
        --set clusterName=ci --set cp.endpoint=https://x.example.com
        --set image.tag=0.1.0 --set identity.mode=file
        --set identity.persistence.enabled=true --set enrollment.enabled=true
        --set enrollment.tokenSecretName=sb-agent-enroll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: explicit fsGroupChangePolicy wins over the file-mode default
        run: |
          out=$(helm template r agent/ $ARGS --set podSecurityContext.fsGroupChangePolicy=Always --show-only templates/deployment.yaml)
          grep -q 'fsGroupChangePolicy: Always' <<<"$out"
          if grep -q 'OnRootMismatch' <<<"$out"; then exit 1; fi

      - name: no fsGroup, no fsGroupChangePolicy
        run: |
          out=$(helm template r agent/ $ARGS --set podSecurityContext.fsGroup=null --show-only templates/deployment.yaml)
          if grep -q 'fsGroupChangePolicy' <<<"$out"; then exit 1; fi

      - name: explicit strategy wins over the file-mode default
        run: |
          out=$(helm template r agent/ $ARGS --set strategy.type=Recreate --show-only templates/deployment.yaml)
          grep -A1 'strategy:' <<<"$out" | grep -q 'type: Recreate'
          if grep -q 'maxSurge' <<<"$out"; then exit 1; fi

  agent-ssa-upgrade:
    # #37: an agent Deployment created without a strategy carries the
    # defaulted rollingUpdate block. Server-side apply (Argo CD
    # ServerSideApply=true, Flux) doesn't remove fields it never owned, so
    # the file-mode strategy must apply on top of it.
    name: agent file-mode upgrade under server-side apply
    runs-on: ubuntu-latest
    env:
      KIND_VERSION: v0.29.0
      ARGS: >-
        --namespace default
        --set clusterName=ci --set cp.endpoint=https://x.example.com
        --set image.tag=0.1.0 --set identity.mode=file
        --set identity.persistence.enabled=true --set enrollment.enabled=true
        --set enrollment.tokenSecretName=sb-agent-enroll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create kind cluster
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum \
            | awk '{print $1"  kind"}' | sha256sum -c -
          sudo install kind /usr/local/bin/kind
          kind create cluster --wait 120s

      - name: Create the Deployment the way a pre-#36 chart did (no strategy)
        run: |
          helm template r agent/ $ARGS --show-only templates/deployment.yaml \
            | yq 'del(.spec.strategy)' > old.yaml
          kubectl apply --server-side --field-manager=ci-sync -f old.yaml
          kubectl get deploy r-secrets-bridge-agent -o jsonpath='{.spec.strategy}' | grep -q '"maxSurge":"25%"'

      - name: Upgrade to the current chart with server-side apply
        run: |
          helm template r agent/ $ARGS --show-only templates/deployment.yaml > new.yaml
          kubectl apply --server-side --force-conflicts --field-manager=ci-sync -f new.yaml
          s=$(kubectl get deploy r-secrets-bridge-agent -o jsonpath='{.spec.strategy}')
          echo "$s"
          [ "$s" = '{"rollingUpdate":{"maxSurge":0,"maxUnavailable":"100%"},"type":"RollingUpdate"}' ]

  release-name:
    name: release-name truncation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # K8s label values are capped at 63 chars. The chart's helpers
      # `trunc 63` everything they generate, but a long release name
      # paired with a long component suffix can still slip past if a
      # template forgets to wrap a helper. This job exercises every
      # rendered Service/Deployment/ServiceAccount name with a 50-char
      # release name and greps for >63-char metadata.name lines.
      - name: render with a long release name
        run: |
          LONG_NAME=$(printf 'a%.0s' {1..50})
          helm template "$LONG_NAME" secrets-bridge/ \
            --set env=dev --set kms.backend=local \
            --set ingress.host=x.example.com \
            > out.yaml
          # Find any `  name: xxx` line where xxx is >63 chars
          awk '/^  name: / { n=$2; if (length(n) > 63) { print "TOO LONG ("length(n)"): "n; bad=1 } } END { exit bad?1:0 }' out.yaml
