name: ci

# Gates every chart change with four jobs:
#
#   1. lint          — `helm lint` for each chart
#   2. template      — `helm template` under realistic presets and
#                      `kubeconform` against the rendered manifests
#                      to catch any K8s-API-shape regression before
#                      it reaches a cluster
#   3. safety-rails  — verifies the documented render-time `fail`
#                      guards actually trip (otherwise the safety
#                      story is theatre, not code)
#   4. release-name  — sanity check that the chart names + per-component
#                      fullnames truncate cleanly to ≤63 chars under a
#                      long release name (K8s label length limit)
#
# CI does NOT publish. OCI publish to GHCR lands in a follow-up
# workflow gated on git tags `v*.*.*`.

on:
  push:
    branches: [main]
    paths:
      - 'secrets-bridge/**'
      - 'agent/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'secrets-bridge/**'
      - 'agent/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'

permissions:
  contents: read

env:
  HELM_VERSION: v3.20.0
  KUBECONFORM_VERSION: v0.7.0

jobs:
  lint:
    name: helm lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [secrets-bridge, agent]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint ${{ matrix.chart }}
        run: helm lint ${{ matrix.chart }}/

  template:
    name: helm template + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render + validate secrets-bridge (dev preset)
        run: |
          mkdir -p out
          helm template ci-dev secrets-bridge/ \
            --namespace secrets-bridge \
            --set env=dev \
            --set kms.backend=local \
            --set ingress.host=sb.example.com \
            > out/secrets-bridge-dev.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/secrets-bridge-dev.yaml

      - name: Render + validate secrets-bridge (production aws-kms preset)
        # env=production requires every enabled component to resolve to a
        # pinned image (CHT-03 / M11; see secrets-bridge.validateImageTags).
        # api exercises the digest path, the rest exercise a pinned tag, so
        # both mechanisms get covered by this one preset.
        run: |
          helm template ci-prod secrets-bridge/ \
            --namespace secrets-bridge \
            --set env=production \
            --set kms.backend=aws-kms \
            --set kms.awsKms.region=us-east-1 \
            --set kms.awsKms.keyId=alias/sb-wrap \
            --set 'api.serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::123456789012:role/sb-api' \
            --set ingress.host=sb.example.com \
            --set ingress.tls.clusterIssuer=letsencrypt-prod \
            --set controller.config.leaderElect=true \
            --set controller.metricsService.enabled=true \
            --set controller.config.metricsAddr=":8080" \
            --set api.image.digest=sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 \
            --set ui.image.tag=0.1.0 \
            --set worker.image.tag=0.1.0 \
            --set controller.image.tag=0.1.0 \
            > out/secrets-bridge-prod.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/secrets-bridge-prod.yaml

      - name: Render + validate secrets-bridge (production vault-transit preset)
        run: |
          helm template ci-vault secrets-bridge/ \
            --namespace secrets-bridge \
            --set env=production \
            --set kms.backend=vault-transit \
            --set kms.vaultTransit.addr=https://vault.example.com \
            --set kms.vaultTransit.key=sb-wrap \
            --set ingress.host=sb.example.com \
            --set api.image.tag=0.1.0 \
            --set ui.image.tag=0.1.0 \
            --set worker.image.tag=0.1.0 \
            --set controller.image.tag=0.1.0 \
            > out/secrets-bridge-vault.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/secrets-bridge-vault.yaml

      - name: Render + validate agent (full preset with NetworkPolicy)
        # The agent only renders a pinned image (CHT-N-01). This preset
        # exercises the digest path, the private-CA one a release tag.
        run: |
          helm template ci-agent agent/ \
            --namespace secrets-bridge \
            --set clusterName=ci-cluster \
            --set cp.endpoint=https://sb.example.com \
            --set image.digest=sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 \
            --set providers.vault.enabled=true \
            --set providers.vault.addr=http://vault.svc:8200 \
            --set providers.vault.kubernetesRole=ci-agent \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.allowCIDRs={10.0.0.10/32,10.0.0.20/32}' \
            --set podDisruptionBudget.enabled=true \
            > out/agent.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/agent.yaml

      - name: Render + validate agent (private-CA TLS preset)
        run: |
          helm template ci-agent-ca agent/ \
            --namespace secrets-bridge \
            --set clusterName=ci-cluster \
            --set cp.endpoint=https://sb.internal \
            --set cp.caExistingSecret=cp-ca \
            --set cp.tlsServerName=sb.internal \
            --set image.tag=0.1.0 \
            > out/agent-ca.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition \
            -ignore-missing-schemas \
            out/agent-ca.yaml

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-manifests
          path: out/
          retention-days: 7

  safety-rails:
    name: safety rails trip
    runs-on: ubuntu-latest
    env:
      # Shared flags so each case differs from a valid render by exactly
      # the input under test. PROD is a valid production KMS config;
      # PINNED pins every control-plane image; AGENT is a valid agent.
      PROD: >-
        --set env=production --set kms.backend=aws-kms
        --set kms.awsKms.region=us-east-1 --set kms.awsKms.keyId=alias/sb-wrap
        --set ingress.host=x.example.com
      PINNED: >-
        --set api.image.tag=0.1.0 --set ui.image.tag=0.1.0
        --set worker.image.tag=0.1.0 --set controller.image.tag=0.1.0
      AGENT: --set clusterName=ci --set cp.endpoint=https://x.example.com
      DIGEST: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      # `reject` cases must fail to render AND fail with the named error,
      # so a case can't pass because a different guard tripped first.
      # `accept` cases must render.
      - name: production + LocalKMS must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'kms.backend="local" is not permitted' secrets-bridge/ \
            --set env=production --set kms.backend=local --set ingress.host=x.example.com $PINNED

      - name: unknown env value must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'env="staging" is not recognised' secrets-bridge/ \
            --set env=staging --set kms.backend=aws-kms --set ingress.host=x.example.com

      - name: unknown kms.backend must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'kms.backend="azure-key-vault" is not recognised' secrets-bridge/ \
            --set env=production --set kms.backend=azure-key-vault --set ingress.host=x.example.com $PINNED

      # CHT-N-05: the binaries compare SB_ENV / SB_KMS_BACKEND exactly.
      - name: env with the wrong case (Production) must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'env="Production" is not recognised' secrets-bridge/ \
            $PROD $PINNED --set env=Production

      - name: kms.backend with the wrong case (AWS-KMS) must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'kms.backend="AWS-KMS" is not recognised' secrets-bridge/ \
            $PROD $PINNED --set kms.backend=AWS-KMS

      - name: dev + kms.backend with the wrong case (Local) must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'kms.backend="Local" is not recognised' secrets-bridge/ \
            --set env=dev --set kms.backend=Local --set ingress.host=x.example.com

      # CHT-03 / CHT-N-02: production renders pinned images only.
      - name: production + unpinned default (:dev) image must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'api.image resolves to tag "dev", which is not a pinned image' secrets-bridge/ \
            $PROD

      - name: production + floating tag main must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'api.image resolves to tag "main", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set api.image.tag=main

      - name: production + floating tag latest must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'worker.image resolves to tag "latest", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set worker.image.tag=latest

      - name: production + floating X.Y tag must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'ui.image resolves to tag "1.2", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set-string ui.image.tag=1.2

      - name: production + floating X tag must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'controller.image resolves to tag "1", which is not a pinned image' secrets-bridge/ \
            $PROD $PINNED --set controller.image.tag=1

      - name: repo@sha256 digest must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'api.image.digest="ghcr.io/secrets-bridge/api@sha256:' secrets-bridge/ \
            $PROD $PINNED --set api.image.digest=ghcr.io/secrets-bridge/api@$DIGEST

      - name: production + pinned images (digest, X.Y.Z, vX.Y.Z-rc, sha-<hex>) must be accepted
        run: |
          .github/scripts/expect-render.sh accept secrets-bridge/ $PROD \
            --set api.image.digest=$DIGEST --set ui.image.tag=0.1.0 \
            --set worker.image.tag=v1.2.3-rc.1 --set controller.image.tag=sha-0123abc

      - name: dev + default (:dev) image must still be accepted
        run: |
          .github/scripts/expect-render.sh accept secrets-bridge/ \
            --set env=dev --set kms.backend=local --set ingress.host=x.example.com

      - name: agent missing clusterName must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'clusterName is required' agent/ \
            --set cp.endpoint=https://x.example.com --set image.tag=0.1.0

      - name: agent plain HTTP without insecureTransport must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'is plain HTTP' agent/ \
            --set clusterName=ci --set cp.endpoint=http://insecure.example.com --set image.tag=0.1.0

      # CHT-N-01: the agent has no env value, so pinning always applies
      # unless the dev-only image.allowMutableTag escape hatch is set.
      - name: agent default (:dev) image must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'image resolves to tag "dev", which is not a pinned image' agent/ \
            $AGENT

      - name: agent floating tag main must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'image resolves to tag "main", which is not a pinned image' agent/ \
            $AGENT --set image.tag=main

      - name: agent repo@sha256 digest must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'image.digest="ghcr.io/secrets-bridge/agent@sha256:' agent/ \
            $AGENT --set image.digest=ghcr.io/secrets-bridge/agent@$DIGEST

      - name: agent pinned images (digest, X.Y.Z, sha-<hex>) must be accepted
        run: |
          .github/scripts/expect-render.sh accept agent/ $AGENT --set image.digest=$DIGEST
          .github/scripts/expect-render.sh accept agent/ $AGENT --set image.tag=0.1.0
          .github/scripts/expect-render.sh accept agent/ $AGENT --set image.tag=sha-0123abc

      - name: agent :dev with image.allowMutableTag=true must be accepted
        run: |
          .github/scripts/expect-render.sh accept agent/ $AGENT --set image.allowMutableTag=true

      # CHT-N-06: Vault Kubernetes auth reads the projected SA token.
      - name: agent Vault Kubernetes auth with the SA token off must be rejected
        run: |
          .github/scripts/expect-render.sh reject 'serviceAccount.automountServiceAccountToken=false' agent/ \
            $AGENT --set image.tag=0.1.0 \
            --set providers.vault.enabled=true --set providers.vault.addr=https://vault.example.com \
            --set providers.vault.kubernetesRole=sb-agent \
            --set serviceAccount.automountServiceAccountToken=false

  release-name:
    name: release-name truncation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      # K8s label values are capped at 63 chars. The chart's helpers
      # `trunc 63` everything they generate, but a long release name
      # paired with a long component suffix can still slip past if a
      # template forgets to wrap a helper. This job exercises every
      # rendered Service/Deployment/ServiceAccount name with a 50-char
      # release name and greps for >63-char metadata.name lines.
      - name: render with a long release name
        run: |
          LONG_NAME=$(printf 'a%.0s' {1..50})
          helm template "$LONG_NAME" secrets-bridge/ \
            --set env=dev --set kms.backend=local \
            --set ingress.host=x.example.com \
            > out.yaml
          # Find any `  name: xxx` line where xxx is >63 chars
          awk '/^  name: / { n=$2; if (length(n) > 63) { print "TOO LONG ("length(n)"): "n; bad=1 } } END { exit bad?1:0 }' out.yaml
