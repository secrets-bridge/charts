# Secrets Bridge — control plane Helm chart.
#
# Operator orientation:
#   1. Pick an `ingress.host` (the SPA + api both answer here).
#   2. Pick a `kms.backend` (`vault-transit` OR `aws-kms`) — defaults
#      below pin `vault-transit` so a forgotten override doesn't
#      silently boot LocalKMS (the api refuses to boot when
#      `kms.backend=local` AND `env != "dev"`).
#   3. Pre-create the env Secret named by `secrets.existingSecret`
#      with everything the api and worker need: `DATABASE_URL` and
#      `REDIS_URL` (the chart has no values for these; they only come
#      from that Secret), `SB_WRAP_MASTER_KEY` (dev only), and the
#      KMS-specific knobs. See the chart README "Required secrets"
#      for the exact key list per backend.
#   4. Under `env: production`, pin every enabled component's image:
#      `<component>.image.digest` (preferred) or a release / sha-<hex>
#      `<component>.image.tag`. See `api.image` below.

# ── Global ───────────────────────────────────────────────────────────

# Deployment mode. Recognised values (exact, lowercase: the api and
# worker compare SB_ENV case-sensitively, so the chart refuses
# `Production` and the like at render time):
#   "production" — LocalKMS REJECTED at boot; dev seeder skipped.
#                  This is the default.
#   "dev"        — LocalKMS allowed; the api seeds three users on
#                  first boot (admin/approver/requester).
#
# Threaded into every component's pod env as SB_ENV.
env: production

global:
  imageRegistry: ghcr.io
  # Image pull secrets the cluster ServiceAccount should reference.
  # Leave empty when pulling from a public registry like GHCR.
  imagePullSecrets: []
  # Cluster-wide labels merged onto every resource the chart renders.
  commonLabels: {}
  commonAnnotations: {}

# Override the inferred name (defaults to `secrets-bridge`).
nameOverride: ""
fullnameOverride: ""

# ── Required secrets ─────────────────────────────────────────────────
#
# By default the chart references an existing Kubernetes Secret that
# the operator pre-creates with every env var the api / worker need:
#
#   - SB_WRAP_MASTER_KEY            (only when env=dev)
#   - DATABASE_URL
#   - REDIS_URL
#   - SB_KMS_VAULT_ADDR / TOKEN / KEY  (kms.backend=vault-transit)
#   - SB_KMS_AWS_REGION / KEY_ID       (kms.backend=aws-kms)
#
# Operators wiring through External Secrets Operator (ESO) point an
# ExternalSecret at this name and let the chart consume the result
# transparently — pull the bag from AWS Secrets Manager, HashiCorp
# Vault, or any other ESO backend; the chart only sees the
# Kubernetes Secret it produces.
secrets:
  existingSecret: secrets-bridge-env

  # Pod rollout on Secret rotation. The chart can't readily detect
  # ESO-driven updates to the referenced Secret (Helm reads cluster
  # state only at install/upgrade time). When `reloader.enabled` is
  # true the chart stamps the `stakater.com/reloader` annotation on
  # every Deployment that envFrom's the bag, and stakater/reloader
  # rolls the pods within ~30s of a Secret change.
  #
  # See https://github.com/stakater/Reloader. Install once per
  # cluster — the chart only adds the annotation; the reloader
  # controller is a cluster-wide singleton.
  reloader:
    enabled: true

# ── KMS ──────────────────────────────────────────────────────────────

kms:
  # SB_KMS_BACKEND. One of: vault-transit, aws-kms, local (exact,
  # lowercase; matched case-sensitively like the binaries do).
  # The `local` backend will REFUSE to boot unless `env=dev`. The
  # chart additionally refuses to render a manifest with the local
  # backend AND env=production via a templated check (see
  # templates/_validation.tpl).
  backend: vault-transit

  vaultTransit:
    # SB_KMS_VAULT_ADDR — only consulted when backend=vault-transit.
    # Leave empty to fall back to the `existingSecret` reference.
    addr: ""
    # SB_KMS_VAULT_MOUNT — defaults to "transit" in the api binary.
    mount: ""
    # SB_KMS_VAULT_KEY — the Vault transit key name. Required when
    # backend=vault-transit.
    key: ""

  awsKms:
    # SB_KMS_AWS_REGION — only consulted when backend=aws-kms.
    region: ""
    # SB_KMS_AWS_KEY_ID — CMK ARN, key id, or `alias/<name>`.
    keyId: ""
    # SB_KMS_AWS_ENDPOINT — optional (LocalStack / VPC endpoint).
    endpoint: ""

# ── Object storage (media) ───────────────────────────────────────────
#
# S3-compatible object storage for images and media (project and team
# logos today, any later upload). Postgres keeps only the metadata. The
# bucket is private: the api streams objects back through its own
# routes, so the existing authorization applies. Never secret values,
# media only. Read by the api only; the worker doesn't touch media.
#
# Off by default so an existing install keeps rendering until it has a
# bucket. With object storage not configured the api still boots, but
# logo uploads and deletes answer 503 "logo storage is not configured"
# (logos still stored in Postgres keep being served, and the boot log
# warns with their count). Setting the SB_OBJECTSTORE_* keys in
# `secrets.existingSecret` instead works too; the chart then renders
# nothing for them and runs none of the checks below.
#
# When it is configured, the api checks the bucket with HeadBucket at
# boot and refuses to start if the settings are invalid or the bucket
# can't be reached within 15s.
#
# Credentials: the standard AWS SDK chain, never chart values.
#   - AWS S3: IRSA. Put the role ARN in `api.serviceAccount.annotations`
#     (eks.amazonaws.com/role-arn). The role needs s3:ListBucket on
#     arn:aws:s3:::<bucket> with no s3:prefix condition (HeadBucket at
#     boot is authorized by s3:ListBucket and sends no prefix, so a
#     prefix condition denies it), s3:GetObject, s3:PutObject and
#     s3:DeleteObject on arn:aws:s3:::<bucket>/<prefix>/*, plus
#     kms:GenerateDataKey / kms:Decrypt on `kmsKeyId` when sse=aws:kms.
#   - S3-compatible servers (MinIO, ...): `credentials.existingSecret`.
objectStore:
  # Render the SB_OBJECTSTORE_* env vars on the api. When true,
  # `bucket` is required.
  enabled: false
  # SB_OBJECTSTORE_BUCKET. Bucket name, e.g. example-bucket.
  bucket: ""
  # SB_OBJECTSTORE_REGION. Required when enabled, e.g. us-east-1.
  # S3-compatible servers usually accept any value; MinIO defaults to
  # us-east-1.
  region: ""
  # SB_OBJECTSTORE_ENDPOINT. Empty for AWS S3. Set it for an
  # S3-compatible server or an S3 interface VPC endpoint, as a full URL:
  # https://s3.example.com or https://s3.example.com:9000. Plain http://
  # is refused under env=production.
  endpoint: ""
  # SB_OBJECTSTORE_PREFIX. Key prefix inside the bucket, so several
  # installs can share one bucket. e.g. secrets-bridge. The api trims
  # slashes at either end; empty, . or .. segments are refused. Logos
  # live at <prefix>/logos/<kind>/<entity-id>/<sha256>.png, where
  # <kind> is project or team.
  prefix: ""
  # SB_OBJECTSTORE_SSE. Server-side encryption requested on every write:
  #   AES256   SSE-S3 (the chart's default; the api's own default,
  #            with the variable unset, is no SSE header)
  #   aws:kms  SSE-KMS with `kmsKeyId` (required)
  #   ""       send no SSE header; the bucket's default encryption
  #            applies. Use this for a MinIO without a KMS configured,
  #            which rejects SSE-S3 requests.
  # Exact, case-sensitive.
  sse: AES256
  # SB_OBJECTSTORE_KMS_KEY_ID. CMK ARN, key id or alias/<name>. Required
  # when sse=aws:kms and refused with any other sse, as the api does.
  kmsKeyId: ""
  # SB_OBJECTSTORE_FORCE_PATH_STYLE. Path-style addressing
  # (<endpoint>/<bucket>/<key>). Most S3-compatible servers, MinIO
  # included, need true. Leave false for AWS S3.
  forcePathStyle: false
  # SB_OBJECTSTORE_LOGO_BACKFILL ("true" or "false", always rendered when
  # enabled). When true, the api copies logos still stored in Postgres
  # to the bucket at start and clears their bytes. It runs in the
  # background on one replica at a time (Redis lock), is idempotent, and
  # also picks up rows that old replicas wrote during a rollout.
  #
  # Upgrading a multi-replica install from an api version that stored
  # logos in Postgres takes two steps:
  #   1. Deploy the new version with logoBackfill: false. Migration 0040
  #      runs; old replicas keep reading and writing Postgres while new
  #      replicas write to the bucket.
  #   2. Once every replica runs the new version, set logoBackfill: true
  #      (or drop the override) and let the pods restart. Check the
  #      "logo backfill done" log line, or that
  #      SELECT count(*) FROM project_logos WHERE png IS NOT NULL
  #      (and the same for team_logos) returns 0.
  # A single replica, or an install that can live with a short window
  # where an old replica serves an empty image, can skip step 1.
  logoBackfill: true
  # Static credentials for S3-compatible servers, read from a Secret you
  # create (never from values). When `existingSecret` is set, the api
  # gets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY through
  # secretKeyRef. Leave it empty on AWS and use IRSA instead. Not
  # allowed with kms.backend=aws-kms: the SDK chain prefers these
  # variables over IRSA, so the KMS client would sign with the object
  # store's keys.
  credentials:
    existingSecret: ""
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

# ── api ──────────────────────────────────────────────────────────────

api:
  enabled: true
  image:
    repository: secrets-bridge/api
    # Defaults to .Chart.AppVersion ("dev" pre-v0.1.0) when empty.
    # Under env=production (CHT-N-02) only pinned tags render: a full
    # release version (X.Y.Z / vX.Y.Z, optional -prerelease) or a
    # sha-<hex> build tag. Moving tags (dev, latest, main, X.Y, X) fail
    # the render. Same rule for ui, worker and controller.
    tag: ""
    # Immutable digest pin: the bare "sha256:<64 hex>" value, no
    # repository and no "@" (the chart renders <repository>@<digest>).
    # Overrides `tag` entirely when set. Prefer this for any
    # production install.
    digest: ""
    # `Always` while the chart ships a mutable `:dev` tag by default
    # (pre-v0.1.0): IfNotPresent would happily run a stale image
    # forever once a node has cached it. Safe to leave on Always even
    # after pinning `digest`; a digest pull is a cache hit either way.
    pullPolicy: Always
  replicaCount: 2
  port: 8080

  # IRSA: when backend=aws-kms, set this to the role ARN that grants
  # kms:Encrypt / Decrypt / GenerateDataKey on the configured CMK. The
  # same role carries the S3 permissions when objectStore.enabled=true
  # (see the objectStore block above).
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    # The api never calls the Kubernetes API: it's a Fiber HTTP
    # service over Postgres/Redis/KMS. Default false (CHT-07); flip
    # true only if you wire something (e.g. a future in-cluster
    # discovery client) that genuinely needs the SA token. IRSA
    # (annotations above) does NOT need this: the EKS Pod Identity
    # webhook injects its own projected web-identity token
    # independently of this flag. Rendered on the pod spec as well as
    # the ServiceAccount (CHT-N-06), so it also holds with
    # create=false, when the pod runs as an SA this chart doesn't own.
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 2
    periodSeconds: 5

  # Non-secret config; secret-bearing env vars are pulled from
  # `secrets.existingSecret` via envFrom.
  config:
    logLevel: info
    gitopsEnabled: false

    # Local-admin bootstrap (architect Q1). Optional user-id grant
    # of the seed `admin` role on first boot. Email + password are
    # confidential and live in the env Secret as
    # SB_BOOTSTRAP_ADMIN_EMAIL / SB_BOOTSTRAP_ADMIN_PASSWORD.
    # `bootstrap.userId` is NOT a credential — it's the opaque user
    # id whose `user_roles` row gets created. Idempotent: once any
    # admin grant exists, the bootstrap is a no-op.
    bootstrap:
      userId: ""

    # OIDC client (architect Q4–Q6 + Slice E). When `oidc.issuer` is
    # empty, the OIDC routes are NOT mounted and the local-admin
    # /auth/login path stays the only sign-in surface.
    #
    # `clientSecret` is confidential → must live in the env Secret
    # (SB_OIDC_CLIENT_SECRET). The chart never renders it.
    oidc:
      # SB_OIDC_ISSUER. Authentik example:
      # https://authentik.example.com/application/o/secrets-bridge/
      issuer: ""
      # SB_OIDC_CLIENT_ID. Public identifier registered with the IdP.
      clientId: ""
      # SB_OIDC_REDIRECT_URL. Public callback URL; must match the
      # IdP's registered redirect for the client.
      redirectUrl: ""
      # SB_OIDC_SCOPES. Space-separated. Add `groups` explicitly if
      # your IdP requires it for the claim to appear.
      scopes: "openid profile email"
      # SB_OIDC_POST_LOGOUT_REDIRECT. Where the IdP sends users after
      # the end_session_endpoint redirect.
      postLogoutRedirect: ""

      # --- Group-claim → role mapping (Slice E) -----------------
      #
      # The reconciler runs on every OIDC sign-in. Removing a user
      # from `sb-admins` in the IdP revokes their admin grant at the
      # NEXT login — no manual sync.
      #
      # Critical invariant the api enforces (do NOT relax this in
      # any future "cleanup" — it IS the security boundary):
      #   The reconciler ONLY touches user_roles rows with
      #   `granted_by = 'system:oidc'`. Admin-assigned grants
      #   (SB_BOOTSTRAP_ADMIN_USER_ID, manually-curated team-scoped
      #   grants) are invisible to it and survive every reconcile
      #   pass, including the "no matching groups" case.

      # SB_OIDC_GROUP_CLAIM — ID-token claim carrying the user's
      # groups. Authentik / Keycloak / Okta default to "groups".
      groupClaim: groups

      # SB_OIDC_GROUP_MAP — IdP-group → Secrets Bridge role.
      # Example:
      #   groupMap:
      #     sb-admins:    admin
      #     sb-approvers: approver
      #     sb-devs:      developer
      # Empty map → reconciler short-circuits; JIT users get no
      # grants (admin assigns from the UI). The chart serializes
      # this map to JSON for the env var; the api validates the
      # shape at boot and FAILS LOUD on malformed JSON or empty
      # keys/values.
      groupMap: {}

      # SB_OIDC_TRUSTED_AMR_MFA (Slice H4 api decoupling).
      # When false (DEFAULT, post-H4 architectural pivot), the
      # OIDC callback records `amr` in the audit metadata but
      # does NOT stamp `last_mfa_at` on the session. The app's
      # own /auth/mfa/{challenge,verify} is the SOLE path that
      # marks a session MFA-fresh.
      # When true, the legacy Slice D behaviour is preserved:
      # the callback stamps `last_mfa_at` when the IdP's `amr`
      # claim carries an RFC 8176 strong factor. Operators
      # running an IdP that genuinely enforces MFA (Entra /
      # Okta with strong policy) flip this back to skip the
      # app-side step-up modal.
      # `amr` is recorded in audit either way — forensic
      # visibility doesn't depend on the trust knob.
      trustAmrForMFA: false

    # App-level MFA (Slices H1–H5 + I1–I3). The api owns enrollment
    # + step-up directly:
    #   /users/me/mfa/*             enrollment + management
    #   /auth/mfa/{challenge,verify} step-up
    #
    # TOTP works with zero config — the issuer renders into the
    # otpauth:// label that authenticator apps display under the
    # account name.
    #
    # WebAuthn is OFF by default — the relying-party config has no
    # safe defaults (the browser rejects ceremonies whose RPID
    # doesn't match the origin's eTLD+1). When both `rpId` and
    # `rpOrigins` are set the api mounts the WebAuthn routes; when
    # either is empty those routes return 503 and TOTP remains the
    # only enrollable factor.
    mfa:
      # SB_REQUIRE_MFA_AT_LOGIN (Slice K).
      # When true, EVERY authenticated route requires the session
      # to have been MFA-verified at least once (not just the
      # Tier-2 approve / reject / reveal paths). The SPA's onError
      # interceptor opens the step-up modal immediately after sign-
      # in; users with no factor enrolled are routed to /me/mfa.
      # When false (DEFAULT), the existing step-up-only model
      # applies — Tier-1 browsing only needs a session cookie.
      #
      # Carve-outs the api keeps open regardless: /users/me,
      # /users/me/mfa/*, /auth/logout, /auth/mfa/{challenge,verify}
      # — without those the gate would be self-locking.
      #
      # Operators who want the AWS-console / GitHub-org-2FA-required
      # posture flip this on. Deployments comfortable with step-up-
      # only on the value-bearing actions leave it off.
      requireMFAAtLogin: false

      # SB_MFA_TOTP_ISSUER — rendered into the otpauth:// URI's
      # `issuer=` param + the label prefix. Authenticator apps
      # display this under the user's account name. Override per
      # environment so operators running multiple environments
      # don't see two identically-named entries on their phone
      # (e.g. "Secrets Bridge (UAT)" / "Secrets Bridge (prod)").
      totpIssuer: "Secrets Bridge"

      webauthn:
        # SB_MFA_WEBAUTHN_RP_ID — effective domain (e.g.
        # `sb.example.com`). MUST be the eTLD+1 of the SPA's
        # origin or the browser rejects the ceremony. Empty
        # value disables the WebAuthn routes at the api side.
        rpId: ""
        # SB_MFA_WEBAUTHN_RP_DISPLAY_NAME — free text rendered in
        # the authenticator's enrollment dialog ("Add Secrets
        # Bridge?"). Falls back to "Secrets Bridge" when empty.
        rpDisplayName: "Secrets Bridge"
        # SB_MFA_WEBAUTHN_RP_ORIGINS — list of fully-qualified
        # origins permitted for the ceremony. Production deploys
        # typically list one entry (the SPA's https origin);
        # local dev adds http://localhost:5173 for Vite. The api
        # rejects WebAuthn responses whose origin isn't in the
        # list. Empty list disables the WebAuthn routes at the
        # api side.
        rpOrigins: []

  # Horizontal pod autoscaler. Off by default; flip enabled when the
  # metrics-server / Prometheus adapter is wired.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # CHT-01 / M9: default-deny NetworkPolicy. Only the ingress
  # controller may reach :8080; egress is DNS (plus the object store
  # when objectStore.enabled, see egress.objectStore) until you add
  # `extraRules` for Postgres / Redis / KMS / the OIDC issuer,
  # destinations the chart can't know in advance. Requires a
  # NetworkPolicy-enforcing CNI (Calico, Cilium, the AWS VPC CNI
  # network-policy add-on, ...); a non-enforcing CNI silently
  # ignores this object.
  networkPolicy:
    enabled: true
    ingress:
      # Namespace the ingress controller's pods run in. The shared
      # Ingress (templates/ingress.yaml) is meant to be the only path
      # to this Service; override to match your ingress controller
      # (ingress-nginx, aws-load-balancer-controller webhook ns, ...).
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector: {}
    egress:
      # {} (default) resolves to kube-system. Override for a
      # non-standard CoreDNS/kube-dns namespace.
      dnsNamespaceSelector: {}
      # One NetworkPolicyEgressRule per destination the api actually
      # needs to reach, e.g.:
      #   extraRules:
      #     - to: [{ ipBlock: { cidr: 10.0.10.0/24 } }]   # Postgres + Redis subnet
      #       ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 6379 }]
      #     - to: [{ ipBlock: { cidr: 10.0.20.10/32 } }]  # Vault (kms.backend=vault-transit)
      #       ports: [{ protocol: TCP, port: 8200 }]
      # aws-kms / an external OIDC issuer typically ride the same
      # broad-443 pattern the agent chart uses (see its
      # networkPolicy.allowCIDRs doc) if you'd rather not enumerate
      # AWS's / your IdP's IP ranges.
      extraRules: []
      # Egress to the object store, rendered only when
      # objectStore.enabled=true. The port comes from
      # objectStore.endpoint: its explicit port, else 443 (https) or 80
      # (http); 443 with no endpoint (AWS S3). With `to` empty the rule
      # allows that port to any destination, since S3's addresses are
      # neither fixed nor known to the chart (same trade-off as the
      # controller's allowAPIServer). Narrow it with NetworkPolicyPeer
      # entries, e.g. the S3 VPC endpoint subnet or an in-cluster MinIO:
      #   to:
      #     - ipBlock: { cidr: 10.0.30.0/24 }
      #     - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: minio } }
      # Set enabled=false to manage this egress in extraRules yourself.
      objectStore:
        enabled: true
        to: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── ui ───────────────────────────────────────────────────────────────

ui:
  enabled: true
  image:
    repository: secrets-bridge/ui
    tag: ""              # defaults to .Chart.AppVersion ("dev" pre-v0.1.0) when empty
    digest: ""            # immutable "sha256:..." pin; overrides tag when set
    pullPolicy: Always
  replicaCount: 2
  port: 8080            # nginx in the official image listens on 8080

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    # CHT-08: the nginx image is built to run read-only (cache/pid
    # paths point under /tmp; see the `tmp` emptyDir mounted in
    # templates/ui/deployment.yaml). Flip back to false only if you
    # swap in an image that writes elsewhere on its root filesystem.
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 2
    periodSeconds: 5

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # CHT-01 / M9: same default-deny posture as the api. The ui is a
  # static SPA bundle served by nginx, so it makes no backend calls of
  # its own; egress stays DNS-only with no `extraRules` needed by
  # default.
  networkPolicy:
    enabled: true
    ingress:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector: {}
    egress:
      dnsNamespaceSelector: {}
      extraRules: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Shared ingress ───────────────────────────────────────────────────
#
# One Ingress object fronts BOTH ui and api on the SAME host. Path
# routing:
#   /api/v1/*           → api Service
#   / (catch-all)       → ui Service
#
# CHT-02 / M10: `/metrics`, `/readyz`, and `/healthz` are deliberately
# NOT in the public default: they used to route straight to the
# internet. `/metrics` carries no secret values but is still internal
# operational detail; scrape it in-cluster instead of publicly:
#
#   apiVersion: monitoring.coreos.com/v1
#   kind: ServiceMonitor
#   spec:
#     selector:
#       matchLabels: {app.kubernetes.io/component: api}
#     endpoints:
#       - port: http
#         path: /metrics
#
# (targets the api's ClusterIP Service). With api.networkPolicy enabled
# (the default), :8080 only admits pods from
# api.networkPolicy.ingress.namespaceSelector (the ingress controller),
# not the release namespace or your monitoring stack, so the scrape is
# dropped until you allow it. NetworkPolicies are additive: add your own
# policy that selects the api pods and admits your Prometheus namespace
# on TCP 8080.
# `/healthz` stays available to add back via `apiPaths` below if your
# ingress controller / external LB wants an HTTP-level health check
# path instead of relying on the pod's own liveness probe.
#
# Same-origin posture means the SPA calls `/api/v1/*` relative to its
# own host — no CORS, no separate domain, one TLS cert.

ingress:
  enabled: true
  className: nginx
  host: secrets-bridge.example.com
  annotations: {}
  # Path prefixes routed to the api. Adjust if your reverse proxy
  # rewrites paths, or add back "/healthz" for an ingress-level probe.
  apiPaths:
    - /api
  # All non-api traffic falls through to the ui.
  uiPath: /
  tls:
    enabled: true
    secretName: secrets-bridge-tls
    # Set to "" when bringing your own pre-issued cert; otherwise
    # cert-manager.io/cluster-issuer: <name> is added.
    clusterIssuer: ""

# ── worker ───────────────────────────────────────────────────────────
#
# Background sweepers + the GitOps observation poller. The worker
# shares the api's env Secret (DATABASE_URL, REDIS_URL, KMS knobs)
# but never exposes a Service. Its probe listener binds
# `bindAddress` (0.0.0.0 by default, see below) so the kubelet can
# reach it on the pod IP.

worker:
  enabled: true
  image:
    repository: secrets-bridge/worker
    tag: ""              # defaults to .Chart.AppVersion ("dev" pre-v0.1.0) when empty
    digest: ""            # immutable "sha256:..." pin; overrides tag when set
    pullPolicy: Always
  # The worker uses a per-sweeper Redis lock for leader election;
  # replicas > 1 is supported (N-1 will silently skip ticks).
  replicaCount: 1

  serviceAccount:
    create: true
    name: ""
    annotations: {}
    # The worker never calls the Kubernetes API. Default false
    # (CHT-07); flip true only if you wire something that genuinely
    # needs the SA token. Rendered on the pod spec too (CHT-N-06).
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  # Probes addressability.
  #
  # The worker binds an HTTP listener for /healthz + /readyz + /metrics.
  # `bindAddress` is the address it listens on inside the pod, plumbed
  # into the container as SB_WORKER_LOCAL_ADDR.
  #
  # IMPORTANT: kubelet runs httpGet probes from the NODE's network
  # namespace (not the pod's). If the listener binds 127.0.0.1 and the
  # probe is also 127.0.0.1, the kubelet hits the node's loopback —
  # nothing answers and the worker stays NotReady forever.
  #
  # The chart defaults to 0.0.0.0 so the probe (running on the node)
  # can reach the listener via the pod IP. The worker still has NO
  # Service in front of it — the only reachability into 0.0.0.0:8091
  # is from inside the pod's netns OR via the pod IP from the same VPC
  # (which a NetworkPolicy in the same chart blocks by default).
  #
  # If you want the strict loopback-only posture (BRD §15 — agent has
  # no inbound listener), set `bindAddress: 127.0.0.1` AND switch
  # `livenessProbe`/`readinessProbe` to an `exec` probe. That
  # requires a base image with a shell + wget/curl; the default
  # distroless/static doesn't carry one, so the chart's default
  # posture is pod-IP probing.
  probesPort: 8091
  bindAddress: 0.0.0.0
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8091
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8091
    initialDelaySeconds: 2
    periodSeconds: 5

  # Non-secret config; secret-bearing env vars come from
  # `secrets.existingSecret` via envFrom (same bag as the api).
  config:
    logLevel: info
    # Mirror the api's GitOps flag — BOTH sides must agree.
    gitopsEnabled: false
    # Sweep cadences. Defaults match the worker binary; uncomment to
    # override.
    # wrapsExpiredInterval: 1m
    # secretsStaleInterval: 5m
    # agentsStaleInterval: 1m
    # jobsRecoveryInterval: 30s
    # discoverInterval: 1h
    # secretsStaleAfter: 24h
    # agentsStaleAfter: 5m
    # gitopsPollInterval: 15s
    # gitopsTimeoutInterval: 1m
    # gitopsHttpTimeout: 15s
    # gitopsBatchSize: 20

  # Notifications. A sweeper-failure webhook URL is sensitive enough
  # (routes to a Slack channel / PagerDuty integration) that it must
  # NEVER be a plaintext chart value (CHT-05 / M12): Helm would
  # render it straight into the rendered manifest and into
  # `helm get values` / `helm diff` output. Reference a key in an
  # existing Secret instead; flip slackFormat to true for the
  # `{"text": "..."}` envelope that Slack inbound webhooks expect.
  notifications:
    webhookUrlSecretRef:
      # name: "" defaults to `secrets.existingSecret` (the same bag
      # already envFrom'd into this pod). Add SB_WORKER_WEBHOOK_URL
      # to that bag and set only `key` below. Set `name` explicitly
      # to reference a different pre-created Secret instead.
      name: ""
      # Empty = no webhook configured (sweeper failures only log).
      key: ""
    slackFormat: false

  # SB_DISCOVER_TARGETS_JSON — list of (cluster, provider, scope)
  # entries the discover scheduler enqueues jobs for. Format:
  #   [{"cluster":"prod-eu","provider":"vault","scope":{...}}, ...]
  # Empty disables the discover sweeper. Future PR: replace with a
  # provider_connections admin API (api repo).
  discoverTargetsJSON: ""

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # CHT-01 / M9: no Service fronts the worker, so ingress is denied
  # entirely (kubelet reaches the probe port via the pod IP directly,
  # outside pod-to-pod NetworkPolicy enforcement on most CNIs; see
  # `bindAddress` above). Egress needs the same Postgres/Redis/KMS
  # destinations as the api, plus wherever `notifications.webhookUrlSecretRef`
  # points.
  networkPolicy:
    enabled: true
    egress:
      dnsNamespaceSelector: {}
      extraRules: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── controller ───────────────────────────────────────────────────────
#
# Kubernetes operator (kubebuilder) that reconciles SecretsSync CRs.
# Owns the cluster-scoped CRD `secretssyncs.sync.secrets-bridge.io`.
# Does NOT hold provider credentials or contact Postgres/Redis — it
# only VALIDATES that each CR's source + destination references
# parse cleanly; actual value movement happens via the agent
# elsewhere.

controller:
  enabled: true

  # CRD installation. When true, the chart renders the
  # `SecretsSync` CRD as part of the release. Switch to false in
  # environments where the CRD is managed out-of-band (e.g.
  # cluster-wide GitOps pipeline that pre-installs CRDs).
  installCRDs: true

  image:
    repository: secrets-bridge/controller
    tag: ""              # defaults to .Chart.AppVersion ("dev" pre-v0.1.0) when empty
    digest: ""            # immutable "sha256:..." pin; overrides tag when set
    pullPolicy: Always
  replicaCount: 1

  serviceAccount:
    create: true
    name: ""
    annotations: {}
    # Stays true (unlike api/worker; see CHT-07): controller-runtime
    # authenticates to the cluster's Kubernetes API server using this
    # SA's projected token (in-cluster REST config); it's not an
    # unused default here, it's the credential the manager reads
    # SecretsSync objects, writes their status and holds the
    # leader-election Lease with.
    automountServiceAccountToken: true

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  # Manager flags. The defaults match the controller binary; flip
  # leaderElect=true when running replicaCount > 1, and set a
  # non-zero metricsAddr to scrape Prometheus.
  config:
    healthProbeAddr: ":8081"
    metricsAddr: "0"            # "0" disables metrics; ":8080" enables
    metricsSecure: true
    leaderElect: false
    enableHTTP2: false

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # Metrics service. Off by default — flip enabled=true AND set
  # `controller.config.metricsAddr=:8080` together to expose the
  # /metrics endpoint cluster-internally.
  metricsService:
    enabled: false
    port: 8080

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # CHT-01 / M9. Ingress is denied entirely unless `metricsService.enabled`
  # (the manager's health-probe port 8081 has no Service and isn't
  # meant to be reachable outside the pod's own netns / kubelet).
  # Egress always needs the cluster's Kubernetes API server, whose
  # address (in-cluster Service IP, node port, or a cloud LB) varies
  # per cluster and can't be pinned with a generic selector; see
  # `egress.allowAPIServer` below.
  networkPolicy:
    enabled: true
    ingress:
      # Only rendered when controller.metricsService.enabled=true.
      # {} (default) matches every namespace; tighten to your
      # Prometheus / monitoring namespace for a stricter posture.
      metricsNamespaceSelector: {}
      metricsPodSelector: {}
    egress:
      dnsNamespaceSelector: {}
      # Broad TCP/443 egress so controller-runtime can reach the API
      # server without a cluster-specific CIDR. Set false only if
      # your platform lets you scope this tighter (e.g. a known
      # control-plane CIDR) via `extraRules` instead.
      allowAPIServer: true
      extraRules: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
