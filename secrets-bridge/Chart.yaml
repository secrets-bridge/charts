apiVersion: v2
name: secrets-bridge
description: |
  Secrets Bridge control plane — the api (Fiber/Go), worker (sweepers +
  GitOps poller), ui (React SPA), and controller (Kubernetes
  reconciler), bundled in one chart with a shared ingress.

  The agent runs in workload clusters under a separate `agent` chart;
  the control plane stays in one operator-friendly install.
type: application
home: https://secrets-bridge.io
icon: https://raw.githubusercontent.com/secrets-bridge/.github/main/profile/logo.svg
sources:
  - https://github.com/secrets-bridge/api
  - https://github.com/secrets-bridge/worker
  - https://github.com/secrets-bridge/ui
  - https://github.com/secrets-bridge/controller
maintainers:
  - name: secrets-bridge
    url: https://github.com/secrets-bridge

# Pre-v0.1.0 — the chart and the images it ships are both rolling on
# the `:dev` tag. The first release will bump both to v0.1.0.
version: 0.0.1
appVersion: "dev"

kubeVersion: ">=1.27.0-0"

keywords:
  - secrets
  - secrets-management
  - vault
  - aws-secrets-manager
  - kubernetes
  - control-plane
  - oss
  - workflow
  - approvals
  - rbac
  - audit

annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Docs
      url: https://secrets-bridge.io
    - name: Repository
      url: https://github.com/secrets-bridge
  artifacthub.io/changes: |
    - kind: added
      description: |
        api: objectStore.logoBackfill (default true) renders
        SB_OBJECTSTORE_LOGO_BACKFILL on the api, for the two-step upgrade
        from logos stored in Postgres. New render-time guards match the
        api's boot checks: objectStore.region is required when enabled,
        kmsKeyId is refused with any sse other than aws:kms, prefix
        segments can't be empty, . or .., and logoBackfill must be true
        or false. The documented IAM policy now grants s3:ListBucket on
        the bucket without an s3:prefix condition, since the api's boot
        check is HeadBucket.
    - kind: added
      description: |
        api: object storage settings for media (objectStore.*: bucket,
        region, endpoint, prefix, sse, kmsKeyId, forcePathStyle), mapped
        to SB_OBJECTSTORE_* on the api. Credentials come from IRSA on the
        api ServiceAccount, or for S3-compatible servers from an existing
        Secret via secretKeyRef; never from values. Render-time guards
        refuse a missing bucket, sse=aws:kms without kmsKeyId, an unknown
        sse value, a malformed endpoint, plain http:// under
        env=production, and static keys with kms.backend=aws-kms. The api
        NetworkPolicy allows egress to the object store's port. Off by
        default (objectStore.enabled=false); existing installs render
        unchanged.
    - kind: fixed
      description: |
        worker: bind 0.0.0.0:probesPort by default + drop host:127.0.0.1
        from probes. Kubelet runs httpGet probes from the node netns;
        with the previous 127.0.0.1-bound listener + 127.0.0.1 probe
        target the worker stayed NotReady forever. Loopback-only posture
        is still available via bindAddress: 127.0.0.1 + an exec probe.
    - kind: added
      description: Initial scaffold — api + ui + shared ingress
