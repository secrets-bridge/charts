{{- if and .Values.controller.enabled .Values.controller.config.leaderElect -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "secrets-bridge.componentName" (dict "ctx" . "component" "controller") }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secrets-bridge.componentLabels" (dict "ctx" . "component" "controller") | nindent 4 }}
rules:
  # Leader election uses a Lease lock only: controller-runtime defaults
  # to `leases`, and client-go's LeaseLock calls just get, create and
  # update. No ConfigMap lock is used (CTL-N-02). Mirrors the
  # controller's config/rbac/leader_election_role.yaml.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  # Events: the leader-election recorder posts core/v1 events in this
  # namespace when the lease changes hands.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
{{- end -}}
