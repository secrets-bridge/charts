# Source: secrets-bridge/templates/controller/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-brid
  labels:
    helm.sh/chart: secrets-bridge-0.0.1
    app.kubernetes.io/name: secrets-bridge
    app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: secrets-bridge
    app.kubernetes.io/component: controller
rules:
  # No core/v1 Secret RBAC is declared here on purpose (security
  # assessment CTL-01 / H5, charts#21 CHT-04): the reconciler only
  # validates that Spec.Source and Spec.Destination resolve via the
  # Providers registry: it never Gets, Lists, or Watches a
  # corev1.Secret, and CredentialsSecretRef is not dereferenced
  # anywhere in the controller. Mirrors the kubebuilder RBAC marker
  # in secretssync_controller.go. If a future change wires
  # CredentialsSecretRef up, add a narrowly-scoped Role (not a
  # ClusterRole) for just the namespaces that need it, and add the
  # rule back here in lockstep with the controller-repo marker.
  #
  # SecretsSync (cluster-scoped): the reconciler only reads the spec
  # and writes status, and sets no finalizers (CTL-N-02). Mirrors the
  # controller's config/rbac/role.yaml; keep the two in lockstep.
  - apiGroups: [sync.secrets-bridge.io]
    resources: [secretssyncs]
    verbs: [get, list, watch]
  - apiGroups: [sync.secrets-bridge.io]
    resources: [secretssyncs/status]
    verbs: [patch, update]
