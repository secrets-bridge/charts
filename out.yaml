apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-brid
  namespace: default
  labels:
    helm.sh/chart: secrets-bridge-0.0.1
    app.kubernetes.io/name: secrets-bridge
    app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: secrets-bridge
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secrets-bridge
      app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller's pods may reach :8080 — the shared
    # Ingress (templates/ingress.yaml) is the only intended path in.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres / Redis / KMS / OIDC / any other operator-specific
    # destination — see `api.networkPolicy.egress.extraRules` in
    # values.yaml for examples.
