  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-bridge
        app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        app.kubernetes.io/component: api
      annotations:
        # Force pod rollout when the env Secret rotates. The chart
        # doesn't own the Secret (it's pre-created by the operator
        # via ESO / terragrunt), so we hash a stable input the
        # operator updates whenever the bag changes.
        checksum/config: 553bf1bd56efc3e755dcc621a7f4f0ec5835bed4f1fa8e834d6b5698c46a6bf0
    spec:
      serviceAccountName: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-brid
