apiVersion: v2
name: secrets-bridge-agent
description: |
  Secrets Bridge outbound execution agent. Deployed inside each
  workload cluster / target boundary; communicates outbound-only with
  the central Secrets Bridge control plane and the local secret
  provider (Vault, AWS Secrets Manager, etc.).

  Hard rules baked into this chart:
    - NO DATABASE_URL / REDIS_URL env vars surfaced (BRD §15, §24).
    - No Service rendered; probes reach the listener on the pod IP
      (bindAddress, default 0.0.0.0:8090).
    - Pinned image required (digest, X.Y.Z or sha-<hex>) unless
      image.allowMutableTag=true for local dev.
    - Identity is a read-only Secret (identity.existingSecret, required)
      with agent_id, agent_secret and the customer-generated X25519
      private_key, written from `secrets-bridge-agent enroll` output and
      never set in chart values. No PVC, no writable identity file, no
      cluster-API RBAC.
type: application
home: https://secrets-bridge.io
icon: https://raw.githubusercontent.com/secrets-bridge/.github/main/profile/logo.svg
sources:
  - https://github.com/secrets-bridge/agent
maintainers:
  - name: secrets-bridge
    url: https://github.com/secrets-bridge

# Pre-v0.1.0 — the chart and the image both roll on `:dev`.
version: 0.0.3
appVersion: "dev"

kubeVersion: ">=1.27.0-0"

keywords:
  - secrets
  - secrets-management
  - vault
  - aws-secrets-manager
  - agent
  - kubernetes

annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Docs
      url: https://secrets-bridge.io
    - name: Agent repository
      url: https://github.com/secrets-bridge/agent
  artifacthub.io/changes: |
    - kind: removed
      description: |
        agent: the PVC identity mode and enroll-at-pod-start are removed:
        identity.mode, identity.persistence, identity.mountPath,
        identity.fileName, identity.privateKeyFileName, enrollment.* and
        agent.*. The schema and a template guard refuse them by name.
    - kind: changed
      description: |
        agent: identity.existingSecret is the only identity mode and is
        required. The Secret holds agent_id, agent_secret and private_key
        (from `secrets-bridge-agent enroll`) and is mounted read-only at
        /etc/secrets-bridge/agent with mode 0400 (0440 with fsGroup), wired
        to SB_AGENT_CREDENTIALS_DIR. identity.keys.* maps other key names.
        The Secret is no longer read with envFrom.
    - kind: added
      description: |
        agent: values.schema.json, providers.vault.tokenSecret for Vault
        token auth, and examples for a kubectl-created Secret and External
        Secrets Operator from AWS Secrets Manager or Vault.
