{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "secrets-bridge-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secrets-bridge-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "secrets-bridge-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Hard rule: the agent has NO inbound listener (BRD §15). The
  # NetworkPolicy enforces it from the network side too.
  ingress: []
  egress:
    # DNS — UDP/TCP 53 to kube-system pods.
    - to:
        - namespaceSelector:
            {{- toYaml (default (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")) .Values.networkPolicy.dnsNamespaceSelector) | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.allowCIDRs }}
    # Operator-supplied CIDRs — typically the CP ingress IP and any
    # provider VPC endpoints (Vault, AWS Secrets Manager). Replaces
    # the broad default below with a pinned allow-list.
    - to:
        {{- range .Values.networkPolicy.allowCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- else }}
    # No allowCIDRs supplied (the default): allow HTTPS egress
    # broadly so `cp.endpoint` and any configured provider are
    # reachable out of the box. NetworkPolicy can't match on a
    # hostname, so pinning this requires operator-supplied CIDRs (see
    # `networkPolicy.allowCIDRs` in values.yaml); set them for a
    # tighter production posture.
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end -}}
