# Agent values for a Secret created by create-secret.sh. Safe to commit:
# no credential is set here, only the name of the Secret.
clusterName: prod-eu
cp:
  endpoint: https://secrets-bridge.example.com
image:
  # Pin by digest. Replace with the agent image digest you verified.
  digest: "sha256:<64 hex characters>"
identity:
  existingSecret: secrets-bridge-agent
providers:
  vault:
    enabled: true
    addr: https://vault.example.com
    kvMount: kv
    kubernetesRole: secrets-bridge-agent
