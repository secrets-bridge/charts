# External Secrets Operator store for the agent credential in AWS Secrets
# Manager. ESO reads with its own IRSA role; the agent itself never reads
# this secret from AWS. Give the role secretsmanager:GetSecretValue on the
# one secret ARN (and kms:Decrypt on its key, via secretsmanager).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secrets-bridge-agent-aws
  namespace: secrets-bridge
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            # ServiceAccount annotated with
            # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/eso-secrets-bridge-agent
            name: eso-secrets-bridge-agent
