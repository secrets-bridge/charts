# Syncs the bundle `secrets-bridge-agent enroll --format json` wrote to AWS
# Secrets Manager:
#
#   secrets-bridge-agent enroll ... --format json --output - \
#     | aws secretsmanager put-secret-value \
#         --secret-id arn:aws:secretsmanager:us-east-1:123456789012:secret:secrets-bridge/agents/prod-eu \
#         --secret-string file:///dev/stdin
#
# into the Kubernetes Secret the chart mounts. Only the three keys the
# agent reads are copied.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets-bridge-agent-identity
  namespace: secrets-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secrets-bridge-agent-aws
  target:
    name: secrets-bridge-agent-identity
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: agent_id
      remoteRef:
        key: secrets-bridge/agents/prod-eu
        property: agent_id
    - secretKey: agent_secret
      remoteRef:
        key: secrets-bridge/agents/prod-eu
        property: agent_secret
    - secretKey: private_key
      remoteRef:
        key: secrets-bridge/agents/prod-eu
        property: private_key
