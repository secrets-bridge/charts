# External Secrets Operator store for the agent credential in Vault KV v2.
# ESO logs in with Kubernetes auth under its own role, whose policy grants
# read on the one path, for example:
#
#   path "kv/data/secrets-bridge/agents/prod-eu" { capabilities = ["read"] }
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secrets-bridge-agent-vault
  namespace: secrets-bridge
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-secrets-bridge-agent
          serviceAccountRef:
            name: eso-secrets-bridge-agent
