# Syncs the bundle `secrets-bridge-agent enroll --format json` wrote to Vault:
#
#   secrets-bridge-agent enroll ... --format json --output - \
#     | vault kv put -mount=kv secrets-bridge/agents/prod-eu -
#
# into the Kubernetes Secret the chart mounts. Only the three keys the
# agent reads are copied.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets-bridge-agent
  namespace: secrets-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secrets-bridge-agent-vault
  target:
    name: secrets-bridge-agent
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: agent_id
      remoteRef:
        key: secrets-bridge/agents/prod-eu
        property: agent_id
    - secretKey: agent_secret
      remoteRef:
        key: secrets-bridge/agents/prod-eu
        property: agent_secret
    - secretKey: private_key
      remoteRef:
        key: secrets-bridge/agents/prod-eu
        property: private_key
