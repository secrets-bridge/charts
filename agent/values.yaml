# Secrets Bridge — agent chart.
#
# Operator orientation:
#   1. On the CP, an admin (agent.mint) creates a one-time enrollment
#      token for the provider connection this agent will serve:
#        POST {CP}/api/v1/provider-connections/<id>/agent-enrollment-token
#          → { enrollment_token, expires_at, ... }
#      (Direct mint, POST /api/v1/agents, returns 403 unless the CP runs
#      with SB_ALLOW_DIRECT_AGENT_MINT=true, a break-glass switch.)
#   2. Put the token in a Secret in the workload cluster, reading it at a
#      silent prompt so it stays out of shell history and the process list:
#        read -rs SB_ENROLL_TOKEN
#        printf '%s' "$SB_ENROLL_TOKEN" | kubectl create secret generic \
#          secrets-bridge-agent-enroll --from-file=enrollment_token=/dev/stdin
#        unset SB_ENROLL_TOKEN
#   3. Install with enrollment.enabled=true, identity.mode=file and
#      identity.persistence.enabled=true. On first boot the agent trades
#      the token at POST /api/v1/agents/enroll for its credential and
#      keeps it on the PVC. See "Enrollment" below.
#   4. Set cp.endpoint to the CP's HTTPS URL and clusterName to a stable
#      identifier for this cluster (used by the discovery flow to
#      disambiguate refs per cluster).
#   5. Pin the image: image.digest (preferred) or a release / sha-<hex>
#      image.tag. The chart refuses to render a moving tag unless
#      image.allowMutableTag=true (local dev only).
#   6. Configure the provider section the agent will fetch from
#      (Vault, AWS Secrets Manager, ...). IRSA is the recommended
#      AWS path; no static AWS creds in chart values.

global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  commonLabels: {}
  commonAnnotations: {}

nameOverride: ""
fullnameOverride: ""

image:
  repository: secrets-bridge/agent
  # Defaults to .Chart.AppVersion ("dev" pre-v0.1.0) when empty. CHT-N-01:
  # the chart only renders a pinned image: a full release version
  # (X.Y.Z / vX.Y.Z, optional -prerelease) or a sha-<hex> build tag.
  # Moving tags (dev, latest, main, X.Y, X) fail the render unless
  # allowMutableTag is true.
  tag: ""
  # Bare "sha256:<64 hex>" manifest pin (no repository, no @). Overrides
  # tag when set. Preferred for any real install.
  digest: ""
  # Dev-only escape hatch: render a moving tag (the default :dev, main,
  # ...) anyway. Leave false outside local dev; a moving tag means the
  # code the agent runs can change on the next pod restart.
  allowMutableTag: false
  # `Always` while the chart ships a mutable `:dev` tag by default
  # (pre-v0.1.0): IfNotPresent would happily run a stale image
  # forever once a node has cached it.
  pullPolicy: Always

# Stable identifier for this cluster — required for the discovery
# flow (BRD: one agent ≡ one cluster). Used as the `cluster_name`
# column when discover jobs upsert rows; can't be safely defaulted.
clusterName: ""

replicaCount: 1

# Deployment update strategy. Empty (default) = automatic. In FILE mode the
# chart renders a RollingUpdate with maxSurge 0 and maxUnavailable 100%: the
# old pod is scaled down before the new one is created. The identity volume
# is ReadWriteOnce, so the Kubernetes default (a surge pod first, the old pod
# stopped only once the new one is Ready) hangs every rollout (chart upgrade,
# Reloader restart). Otherwise the Kubernetes default applies. Set this only
# to override, e.g. with a ReadWriteMany existingClaim.
#
# If you set type: Recreate on an existing Deployment and deploy with
# server-side apply (Argo CD ServerSideApply=true, Flux, kubectl apply
# --server-side), the apply fails: the defaulted rollingUpdate block stays on
# the live object and the API server rejects it under Recreate. Clear it once
# with: kubectl patch deploy <name> --type=json \
#   -p '[{"op":"replace","path":"/spec/strategy","value":{"type":"Recreate"}}]'
strategy: {}

serviceAccount:
  create: true
  name: ""
  # Set the IRSA role ARN here when the agent fetches from AWS
  # Secrets Manager via instance role / EKS pod identity.
  annotations: {}
  # CHT-N-06. null (default) = automatic: the SA token is mounted only
  # when Vault Kubernetes auth is configured (providers.vault.enabled
  # with kubernetesRole), because the agent reads it from
  # /var/run/secrets/kubernetes.io/serviceaccount/token to log in to
  # Vault. Otherwise the agent never talks to the Kubernetes API and the
  # token stays off. IRSA / EKS Pod Identity don't need it (their
  # webhooks project their own token). Applied to the pod spec as well,
  # so it holds with serviceAccount.create=false. Set true/false to
  # override; false with Vault Kubernetes auth fails the render. If you
  # pass SB_VAULT_KUBERNETES_ROLE through the identity Secret instead of
  # providers.vault.kubernetesRole, the chart can't see it: set true.
  automountServiceAccountToken: null

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# In FILE mode the chart adds fsGroupChangePolicy: OnRootMismatch when
# fsGroup is set and fsGroupChangePolicy is not, so kubelet stops re-adding
# group bits to the identity and key files on every mount. Set
# fsGroupChangePolicy here to override (e.g. Always).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Probes addressability.
#
# The agent binds an HTTP listener for /healthz + /readyz + /metrics on
# `bindAddress:probesPort` inside the pod (plumbed in as SB_LOCAL_ADDR).
#
# IMPORTANT: kubelet runs httpGet probes from the NODE's network
# namespace (not the pod's). With the listener bound to 127.0.0.1 AND
# the probe target 127.0.0.1, kubelet hits the node's loopback —
# nothing answers and the agent stays NotReady forever.
#
# The chart defaults to 0.0.0.0 so the probe (running on the node)
# can reach the listener via the pod IP. The agent still has NO
# Service in front of it — the only reachability into 0.0.0.0:8090
# is from inside the pod's netns OR via the pod IP from the same VPC
# (which a NetworkPolicy in the same chart blocks by default).
#
# Loopback-only posture (BRD §15) is still available — set
# `bindAddress: 127.0.0.1` AND switch the probes to an `exec`
# command (requires a base image with a shell + wget/curl, which
# distroless/static does not carry).
probesPort: 8090
bindAddress: 0.0.0.0
livenessProbe:
  httpGet:
    path: /healthz
    port: 8090
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /readyz
    port: 8090
  initialDelaySeconds: 2
  periodSeconds: 5

# ── Control plane connection ─────────────────────────────────────────

cp:
  # SB_CP_ENDPOINT. Must be HTTPS: `_validation.tpl` fails the
  # render on a plain `http://` endpoint UNCONDITIONALLY unless
  # `insecureTransport=true` is set explicitly. CHT-09: this chart
  # has no separate `env: dev|production` concept the way the
  # `secrets-bridge` control-plane chart does (see its top-level
  # `env` value). The guard isn't "refused in production", it's
  # "refused always, opt out explicitly for local dev only".
  # Example: "https://secrets-bridge.example.com"
  endpoint: ""

  # Per Piece 7 of the agent: TLS pin to a private CA without
  # trusting the system roots. Provide either:
  #   - caExistingSecret + caExistingSecretKey, OR
  #   - leave both blank to use the cluster's system roots
  caExistingSecret: ""
  caExistingSecretKey: ca.crt
  tlsServerName: ""

  # SB_INSECURE_TRANSPORT. NEVER set to true outside local dev.
  insecureTransport: false

  # Heartbeat cadence (default 30s in the binary).
  heartbeatInterval: ""

  # Job claim loop. Defaults: 5s interval, 4 concurrent workers.
  claimInterval: ""
  claimConcurrency: ""

# ── Identity ─────────────────────────────────────────────────────────
#
# The agent identity is an (agent_id, agent_secret) pair the CP hands
# out exactly once. The supported way to get one is enrollment (below):
# the agent trades a one-time token for it and stores it in a file. The
# static mode needs a pre-created Secret carrying:
#
#   SB_AGENT_ID:     <id>
#   SB_AGENT_SECRET: <secret>
#
# Optional X25519 keypair material for the wire-envelope path
# (Piece 8b):
#
#   SB_AGENT_PRIVATE_KEY:      <base64>           (env, prefer file)
#                              -- OR --
#   SB_AGENT_PRIVATE_KEY_FILE: <mount path>
#
# When neither is set, the agent generates an ephemeral keypair per
# boot and registers it with the CP. Acceptable for dev; persistent
# keys are recommended for production so a pod restart doesn't
# rotate the registered pubkey.

identity:
  # Identity source: "existingSecret" (default; static / production) or
  # "file" (enrollment). They map 1:1 to the enrollment switch:
  #   existingSecret  ⟺  enrollment.enabled=false
  #   file            ⟺  enrollment.enabled=true
  mode: existingSecret

  # STATIC mode (mode=existingSecret, the default). The operator
  # pre-creates a Secret carrying SB_AGENT_ID + SB_AGENT_SECRET
  # (+ optional keypair); wired via envFrom. NO writable storage, NO cluster
  # API, readOnlyRootFilesystem stays true. Getting that pair requires a
  # credential the CP already issued (direct mint is off unless the CP
  # sets SB_ALLOW_DIRECT_AGENT_MINT=true), so new installs use FILE mode.
  existingSecret: secrets-bridge-agent

  # FILE mode (mode=file — enrollment). The agent reads/writes its credential
  # at <mountPath>/<fileName> (SB_IDENTITY_FILE) on a WRITABLE, restart-
  # persistent volume, and reuses it on restart (the one-time enrollment
  # token is spent exactly once).
  mountPath: /var/lib/secrets-bridge-agent
  fileName: identity.json

  # FILE mode only: the agent's X25519 wire-envelope private key, kept on the
  # same volume (SB_AGENT_PRIVATE_KEY_FILE=<mountPath>/<privateKeyFileName>).
  # The agent generates it on first boot (mode 0600, never overwritten) and
  # reuses it on restart, so the public key it registers with the CP stays
  # stable and sealed wraps not yet consumed survive a pod restart. Set to ""
  # to fall back to an ephemeral per-boot keypair. Must differ from fileName.
  # (Static mode: put SB_AGENT_PRIVATE_KEY[_FILE] in the identity Secret.)
  privateKeyFileName: agent.key

  # Persistence for FILE mode. MUST be a PVC (chart-created) or a BYO claim.
  # A Kubernetes Secret can NOT back this (the agent persists a FILE and must
  # never hold cluster-API write RBAC — it stays outbound-only, BRD §15/§24),
  # and an emptyDir is REJECTED (a restart would lose the credential and the
  # one-time enrollment token cannot be reused).
  persistence:
    enabled: false
    existingClaim: ""              # BYO a claim; else the chart creates a PVC
    storageClass: ""               # "" = cluster default StorageClass
    accessModes:
      - ReadWriteOnce
    size: 1Gi

# ── Enrollment (agent-1 self-enrollment; charts-1) ───────────────────
#
# Enroll-on-first-boot. An admin creates the ONE-TIME token on the CP with
# POST /api/v1/provider-connections/<id>/agent-enrollment-token. When enabled
# AND no credential is stored, the agent exchanges that token
# (POST /api/v1/agents/enroll) for a persistent
# credential, writes it to identity.persistence, and heartbeats. On restart
# it reuses the persisted credential and does NOT re-enroll (the one-time
# token is spent exactly once). Requires identity.persistence (a writable,
# restart-persistent volume) — a read-only Secret mount cannot enroll.
#
# The one-time token is read from an EXISTING Secret you create — never set
# it as a plaintext chart value (it must not render into a manifest), and
# keep it off the command line:
#   read -rs SB_ENROLL_TOKEN
#   printf '%s' "$SB_ENROLL_TOKEN" | kubectl create secret generic <name> \
#     --from-file=enrollment_token=/dev/stdin
#   unset SB_ENROLL_TOKEN
enrollment:
  enabled: false
  tokenSecretName: ""
  tokenSecretKey: enrollment_token

# Fields reported to the CP at enrollment. clusterName is the top-level
# .Values.clusterName (identity for discovery, already required). name
# defaults to the pod hostname when empty. providerType MUST match the
# enrollment token's binding on the CP.
agent:
  name: ""
  providerType: aws-sm
  region: ""

# ── Providers ────────────────────────────────────────────────────────
#
# Provider connection details consumed by the agent's resolver
# factories (Piece 4c+4d). Credentials are NEVER set as chart values;
# they live in the identity Secret OR cluster-provided IRSA / kube
# auth so this chart can be safely committed alongside application
# code.

providers:
  vault:
    enabled: false
    # SB_VAULT_ADDR
    addr: ""
    # SB_VAULT_NAMESPACE — Vault Enterprise only
    namespace: ""
    # SB_VAULT_KV_MOUNT. Empty means the binary default "kv". Set it to
    # the provider connection's scope.mount. The agent refuses a job that
    # names another mount (discovery and cross-team jobs always name the
    # connection's), and a job that names none runs against this mount,
    # so a mismatch fails discovery and sends reads/patches to the wrong
    # mount.
    kvMount: ""
    # SB_VAULT_KV_PREFIX — restrict reads/writes to a subtree. Must
    # equal the connection's kvPrefix when that sets one.
    kvPrefix: ""
    # SB_VAULT_KUBERNETES_ROLE for k8s-auth (preferred over token)
    kubernetesRole: ""

  awsSecretsManager:
    enabled: false
    # SB_AWS_REGION
    region: ""
    # SB_AWS_ENDPOINT — optional (LocalStack / VPC endpoint)
    endpoint: ""
    # SB_AWS_ROLE_ARN — operator may also wire IRSA via
    # serviceAccount.annotations to avoid this entirely
    roleArn: ""
    # SB_AWS_TAG_FILTER — every AWS tag listed here MUST be present on
    # a secret (with the same value) for it to survive ListMetadata
    # filtering during discovery. Use to lock an agent instance to a
    # specific environment / tenant / project. Pair with the same tag
    # condition on the IRSA policy for defense in depth — the IAM tag
    # condition gates the value fetch, this filter gates enumeration.
    # AWS's ListSecrets API does NOT honour resource-tag IAM conditions
    # so without this, the agent enumerates every secret name in the
    # account even when it can never resolve them.
    # Rendered as JSON into SB_AWS_TAG_FILTER. Empty / unset = no filter.
    # Example:
    #   tagFilter:
    #     Environment: production
    tagFilter: {}

# ── Reloader ─────────────────────────────────────────────────────────

reloader:
  # Stamps the agent Deployment with
  # `secret.reloader.stakater.com/reload: <identity.existingSecret>`
  # so a stakater/reloader install in the cluster rolls the pod
  # within ~30s of any Secret change (rotated keypair, rotated CA).
  enabled: true

# ── NetworkPolicy ────────────────────────────────────────────────────

networkPolicy:
  # Egress-only NetworkPolicy. INGRESS is denied entirely (no inbound
  # listener). Egress allows: DNS (53/UDP+TCP) and HTTPS (443/TCP).
  #
  # CHT-06: default ON, and functional out of the box. With
  # `allowCIDRs` empty (the default) the 443 egress rule is left
  # broad (any destination) so a fresh install can reach `cp.endpoint`
  # plus Vault / AWS Secrets Manager without the operator having to
  # pre-compute CIDRs first. NetworkPolicy has no notion of DNS names,
  # so pinning this down to just the CP + provider IP ranges is only
  # possible once you know them; set `allowCIDRs` to replace the
  # broad rule with a pinned allow-list once you do (recommended for
  # production).
  enabled: true
  dnsNamespaceSelector: {}
  allowCIDRs: []

# ── Pod placement ────────────────────────────────────────────────────

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
