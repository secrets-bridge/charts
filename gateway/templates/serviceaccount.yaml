{{- if .Values.serviceAccount.create -}}
# Release 1 reads no Kubernetes API. This ServiceAccount has no Role or
# binding anywhere in the chart, and its token is never mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "secrets-bridge-gateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secrets-bridge-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- with .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end -}}
