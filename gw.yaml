# Source: secrets-bridge-gateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-b
  namespace: default
  labels:
    helm.sh/chart: secrets-bridge-gateway-0.0.1
    app.kubernetes.io/name: secrets-bridge-gateway
    app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: secrets-bridge
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: secrets-bridge-gateway
      app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-bridge-gateway
        app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        app.kubernetes.io/component: gateway
      annotations:
        # Each replica reads its configuration once at boot, so a change
        # rolls the pods.
        checksum/connectors: 2bf041a3727b560284c6116cbc6af5c5b508389db0effc7bc2fe687705d3acc8
        checksum/config: 89fc9af1d6014c3f981d857c3d1e337acdaf3b30243f5c3b78195df8fb2d083d
    spec:
      serviceAccountName: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-b
      # Release 1 needs no Kubernetes API access. Set on the pod too, so
      # serviceAccount.create=false (an existing or `default` SA) cannot
      # hand the Gateway a token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/secrets-bridge/gateway@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # No ports: the only listener is the loopback health and metrics
          # server.
          env:
            - name: SB_CP_ENDPOINT
              value: "https://cp.example.com"
            - name: SB_GATEWAY_IDENTITY_FILE
              value: "/etc/secrets-bridge/gateway/identity/identity.json"
            - name: SB_GATEWAY_CONNECTORS_FILE
              value: "/etc/secrets-bridge/gateway/config/connectors.json"
            - name: SB_GATEWAY_LOCAL_ADDR
              value: "127.0.0.1:8091"
            - name: SB_LOG_LEVEL
              value: "info"
          livenessProbe:
            exec:
              command: ["/usr/local/bin/gateway", "healthcheck", "--live", "--local-addr", "127.0.0.1:8091", "--timeout", "2s"]
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/gateway", "healthcheck", "--local-addr", "127.0.0.1:8091", "--timeout", "2s"]
            failureThreshold: 3
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 48Mi
          volumeMounts:
            - name: identity
              mountPath: /etc/secrets-bridge/gateway/identity
              readOnly: true
            - name: connectors
              mountPath: /etc/secrets-bridge/gateway/config
              readOnly: true
            # Argo CD tokens: directory mounts (no subPath), so a rotated
            # token reaches the pod without a restart.
            - name: argocd-token-0
              mountPath: /etc/secrets-bridge/gateway/argocd/argocd-main
              readOnly: true
            - name: argocd-ca-0
              mountPath: /etc/secrets-bridge/gateway/argocd-ca/argocd-main
              readOnly: true
            - name: argocd-token-1
              mountPath: /etc/secrets-bridge/gateway/argocd/argocd-local
              readOnly: true
      volumes:
        # Secret files are owned by root with group fsGroup; 0440 is group
        # read only, which the Gateway accepts for its identity file.
        - name: identity
          secret:
            secretName: "sb-gateway-identity"
            defaultMode: 288 # 0440
            items:
              - key: "identity.json"
                path: identity.json
        - name: connectors
          configMap:
            name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-connectors
            defaultMode: 292 # 0444
            items:
              - key: connectors.json
                path: connectors.json
        - name: argocd-token-0
          secret:
            secretName: "sb-gateway-argocd-main"
            defaultMode: 288 # 0440
            items:
              - key: "token"
                path: token
        - name: argocd-ca-0
          secret:
            secretName: "argocd-main-ca"
            defaultMode: 288 # 0440
            items:
              - key: "ca.crt"
                path: ca.crt
        - name: argocd-token-1
          secret:
            secretName: "sb-gateway-argocd-local"
            defaultMode: 288 # 0440
            items:
              - key: "token"
                path: token
