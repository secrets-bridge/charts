# Source: secrets-bridge-gateway/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-secrets-b
  namespace: default
  labels:
    helm.sh/chart: secrets-bridge-gateway-0.0.1
    app.kubernetes.io/name: secrets-bridge-gateway
    app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: secrets-bridge
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secrets-bridge-gateway
      app.kubernetes.io/instance: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  # The Gateway has no inbound listener; health and metrics stay on
  # loopback and the probes run inside the container.
  ingress: []
  egress:
    # DNS, to the cluster DNS pods only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Control plane (cp.endpoint).
    - to:
        - ipBlock:
            cidr: "192.0.2.10/32"
        - ipBlock:
            cidr: "192.0.2.11/32"
      ports:
        - port: 443
          protocol: TCP
    # Argo CD connector argocd-main.
    - to:
        - ipBlock:
            cidr: "198.51.100.20/32"
      ports:
        - port: 443
          protocol: TCP
    # Argo CD connector argocd-local.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
      ports:
        - port: 8080
          protocol: TCP
